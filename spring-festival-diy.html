<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>过年置办 - DIY地图</title>
    <script src="https://webapi.amap.com/maps?v=2.0&key=ca95c0ee3d37ae8d31f2790db3f0e99d&securityJsCode=7bbadcee61ad1d59c9f86f2085377565"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #1a1a2e; color: #fff; overflow: hidden; height: 100vh; }
        #container { width: 100%; height: 100%; position: relative; }
        
        .top-bar { position: absolute; top: 0; left: 0; right: 0; background: linear-gradient(180deg, rgba(26,26,46,0.98) 0%, rgba(26,26,46,0.9) 100%); padding: 12px 16px 20px; z-index: 999; }
        .search-wrap { position: relative; }
        .search-input { width: 100%; height: 46px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-radius: 23px; padding: 0 16px 0 44px; font-size: 16px; color: #fff; outline: none; }
        .search-input::placeholder { color: rgba(255,255,255,0.4); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); font-size: 18px; }
        .search-results { position: absolute; top: 58px; left: 0; right: 0; max-height: 280px; overflow-y: auto; background: rgba(30,30,50,0.98); border-radius: 16px; display: none; z-index: 1001; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .search-results.active { display: block; }
        .sug-item { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: background 0.15s; }
        .sug-item:hover { background: rgba(255,255,255,0.08); }
        .sug-item:last-child { border-bottom: none; }
        .sug-name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .sug-addr { font-size: 12px; color: rgba(255,255,255,0.5); }
        
        .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(20,20,35,0.96); backdrop-filter: blur(20px); padding: 8px 0 24px; z-index: 999; border-top: 1px solid rgba(255,255,255,0.05); }
        .nav-tabs { display: flex; justify-content: space-around; }
        .nav-tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0; cursor: pointer; border-radius: 12px; transition: all 0.2s; flex: 1; }
        .nav-tab:hover { background: rgba(255,255,255,0.05); }
        .nav-tab.active { background: rgba(255,59,48,0.15); }
        .nav-icon { font-size: 24px; line-height: 1; }
        .nav-text { font-size: 10px; color: rgba(255,255,255,0.5); }
        .nav-tab.active .nav-text { color: #ff3b30; }
        
        .panel { position: absolute; top: 88px; left: 12px; right: 12px; bottom: 110px; background: rgba(26,26,46,0.96); border-radius: 20px; padding: 16px; display: none; overflow-y: auto; z-index: 500; }
        .panel.active { display: block; animation: slideUp 0.25s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .panel-title { font-size: 18px; font-weight: 700; color: #fff; }
        .panel-close { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; }
        
        .item-card { background: rgba(255,255,255,0.05); border-radius: 14px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; border-left: 4px solid #ff3b30; }
        .item-card:hover { background: rgba(255,255,255,0.1); }
        .item-card.ancestor { border-left-color: #34c759; }
        .item-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .item-name { font-size: 16px; font-weight: 600; color: #fff; }
        .item-tag { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(255,59,48,0.2); color: #ff3b30; }
        .item-tag.ancestor { background: rgba(52,199,89,0.2); color: #34c759; }
        .item-info { font-size: 12px; color: rgba(255,255,255,0.5); }
        
        .day-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .day-title { font-size: 15px; font-weight: 700; color: #fff; }
        .day-label { font-size: 11px; color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 6px; }
        .day-label.today { background: rgba(255,95,0,0.2); color: #ff9500; }
        .schedule-item { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
        .schedule-item:hover { background: rgba(255,255,255,0.08); }
        .sch-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; background: rgba(255,59,48,0.2); }
        .sch-info { flex: 1; }
        .sch-name { font-size: 14px; font-weight: 600; color: #fff; }
        .sch-time { font-size: 12px; color: rgba(255,255,255,0.5); }
        .sch-del { width: 28px; height: 28px; background: rgba(255,59,48,0.15); border: none; border-radius: 8px; color: #ff3b30; font-size: 14px; cursor: pointer; }
        
        .fab { position: absolute; bottom: 100px; right: 20px; width: 54px; height: 54px; background: linear-gradient(135deg, #ff3b30, #ff6b3d); border: none; border-radius: 50%; color: white; font-size: 28px; cursor: pointer; box-shadow: 0 6px 24px rgba(255,59,48,0.4); z-index: 600; display: none; align-items: center; justify-content: center; }
        .fab.active { display: flex; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 24px 24px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px; animation: slideUpModal 0.3s ease; }
        @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 700; color: #fff; }
        .modal-close { width: 32px; height: 32px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 18px; cursor: pointer; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); margin-bottom: 6px; display: block; }
        .form-input { width: 100%; height: 46px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 0 14px; font-size: 15px; color: #fff; outline: none; }
        .form-input:focus { border-color: #ff3b30; }
        .form-input::placeholder { color: rgba(255,255,255,0.35); }
        .form-select { width: 100%; height: 46px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 0 14px; font-size: 15px; color: #fff; outline: none; }
        .form-select option { background: #1a1a2e; color: #fff; }
        .form-textarea { width: 100%; min-height: 80px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 12px 14px; font-size: 15px; color: #fff; outline: none; resize: vertical; }
        .form-textarea:focus { border-color: #ff3b30; }
        .color-picker { display: flex; gap: 10px; }
        .color-opt { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
        .color-opt.selected { border-color: #fff; transform: scale(1.15); }
        .form-submit { width: 100%; height: 50px; background: linear-gradient(135deg, #ff3b30, #ff6b3d); border: none; border-radius: 14px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .form-delete { width: 100%; height: 46px; background: rgba(255,59,48,0.15); border: 1px solid #ff3b30; border-radius: 14px; color: #ff3b30; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        .addr-wrap { position: relative; }
        .addr-sugs { position: absolute; top: 48px; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: rgba(30,30,50,0.98); border-radius: 12px; display: none; z-index: 2010; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        .addr-sugs.active { display: block; }
        .addr-sug { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; font-size: 14px; color: #fff; }
        .addr-sug:hover { background: rgba(255,255,255,0.08); }
        .addr-sug:last-child { border-bottom: none; }
        .addr-sug-name { font-weight: 600; margin-bottom: 2px; }
        .addr-sug-addr { font-size: 12px; color: rgba(255,255,255,0.5); }
        
        .detail-card { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(180deg, rgba(26,26,46,0.98) 0%, #1a1a2e 100%); backdrop-filter: blur(30px); border-radius: 24px 24px 0 0; padding: 20px; z-index: 1500; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); max-height: 60vh; overflow-y: auto; }
        .detail-card.active { transform: translateY(0); }
        .detail-img { width: 100%; height: 160px; object-fit: cover; border-radius: 16px; margin-bottom: 14px; }
        .detail-title { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .detail-type { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
        .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
        .detail-tag { font-size: 12px; padding: 5px 10px; border-radius: 8px; }
        .detail-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
        .detail-stat { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px; }
        .detail-stat-value { font-size: 14px; font-weight: 700; color: #ff9500; margin-bottom: 2px; }
        .detail-stat-label { font-size: 11px; color: rgba(255,255,255,0.4); }
        .detail-desc { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.6; margin-bottom: 16px; }
        .detail-actions { display: flex; gap: 10px; }
        .detail-btn { flex: 1; height: 46px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .detail-btn.primary { background: linear-gradient(135deg, #ff3b30, #ff6b3d); color: white; }
        .detail-btn.secondary { background: rgba(255,255,255,0.1); color: white; }
        .detail-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; background: rgba(255,255,255,0.1); border: none; border-radius: 50%; color: #fff; font-size: 16px; cursor: pointer; }
        
        .empty-state { text-align: center; padding: 50px 20px; color: rgba(255,255,255,0.4); }
        .empty-icon { font-size: 56px; margin-bottom: 12px; }
        .empty-text { font-size: 14px; }
        
        .map-container { width: 100%; height: 100%; border-radius: 16px; overflow: hidden; }
    </style>
</head>
<body>
    <div id="container"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="mainSearch" placeholder="搜索地点...">
            <div class="search-results" id="mainSearchResults"></div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="showPanel('map')">
                <span class="nav-icon">🗺️</span>
                <span class="nav-text">地图</span>
            </div>
            <div class="nav-tab" onclick="showPanel('list')">
                <span class="nav-icon">📍</span>
                <span class="nav-text">地点</span>
            </div>
            <div class="nav-tab" onclick="showPanel('schedule')">
                <span class="nav-icon">📅</span>
                <span class="nav-text">日程</span>
            </div>
        </div>
    </div>

    <!-- Map Panel -->
    <div class="panel" id="mapPanel"></div>

    <!-- List Panel -->
    <div class="panel" id="listPanel">
        <div class="panel-header">
            <span class="panel-title">我的地点</span>
            <button class="panel-close" onclick="hideAllPanels()">✕</button>
        </div>
        <div id="poiList"></div>
    </div>

    <!-- Schedule Panel -->
    <div class="panel" id="schedulePanel">
        <div class="panel-header">
            <span class="panel-title">置办日程</span>
            <button class="panel-close" onclick="hideAllPanels()">✕</button>
        </div>
        <div id="scheduleList"></div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fabBtn" onclick="openPoiModal()">+</button>

    <!-- Poi Modal -->
    <div class="modal-overlay" id="poiModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="poiModalTitle">添加地点</span>
                <button class="modal-close" onclick="closePoiModal()">✕</button>
            </div>
            <input type="hidden" id="editPoiId">
            <div class="form-group">
                <label class="form-label">名称</label>
                <input type="text" class="form-input" id="inpName" placeholder="如：置办年货">
            </div>
            <div class="form-group">
                <label class="form-label">类型</label>
                <select class="form-select" id="selType">
                    <option value="relative">👨‍👩‍👧‍👦 走亲戚</option>
                    <option value="shopping">🛒 置办年货</option>
                    <option value="ancestor">🕯️ 祭祖上坟</option>
                    <option value="scenic">🏞️ 逛庙会</option>
                    <option value="food">🍜 吃年夜饭</option>
                    <option value="custom">🧧 其他</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">地址（输入后自动搜索高德POI）</label>
                <div class="addr-wrap">
                    <input type="text" class="form-input" id="inpAddr" placeholder="输入地址，如：郑州市">
                    <div class="addr-sugs" id="addrSugs"></div>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">经度 <span style="font-size:11px;color:rgba(255,255,255,0.4)">(点击建议自动填入)</span></label>
                <input type="number" class="form-input" id="selLng" placeholder="点击建议自动填入" step="0.000001">
            </div>
            <div class="form-group">
                <label class="form-label">纬度 <span style="font-size:11px;color:rgba(255,255,255,0.4)">(点击建议自动填入)</span></label>
                <input type="number" class="form-input" id="selLat" placeholder="点击建议自动填入" step="0.000001">
            </div>
            <div class="form-group">
                <label class="form-label">标签（逗号分隔）</label>
                <input type="text" class="form-input" id="inpTags" placeholder="如：重要,优先">
            </div>
            <div class="form-group">
                <label class="form-label">备注</label>
                <textarea class="form-textarea" id="inpDesc" placeholder=""></textarea>
            </div>
            <button class="form-submit" onclick="submitPoi()">保存</button>
            <button class="form-delete" id="delPoiBtn" onclick="delPoi()" style="display:none;">删除</button>
        </div>
    </div>

    <!-- Schedule Modal -->
    <div class="modal-overlay" id="schModal">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">添加日程</span>
                <button class="modal-close" onclick="closeSchModal()">✕</button>
            </div>
            <div class="form-group">
                <label class="form-label">名称</label>
                <input type="text" class="form-input" id="schName" placeholder="如：去超市买年货">
            </div>
            <div class="form-group">
                <label class="form-label">日期</label>
                <input type="date" class="form-input" id="schDate">
            </div>
            <div class="form-group">
                <label class="form-label">时间（可选）</label>
                <input type="time" class="form-input" id="schTime">
            </div>
            <div class="form-group">
                <label class="form-label">关联地点（可选）</label>
                <select class="form-select" id="schPoiSel">
                    <option value="">无</option>
                </select>
            </div>
            <button class="form-submit" onclick="submitSch()">添加</button>
        </div>
    </div>

    <!-- Detail Card -->
    <div class="detail-card" id="detailCard">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <img class="detail-img" id="detailImg" src="" alt="">
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-type" id="detailType"></div>
        <div class="detail-tags" id="detailTags"></div>
        <div class="detail-stats">
            <div class="detail-stat">
                <div class="detail-stat-value" id="detailLng"></div>
                <div class="detail-stat-label">经度</div>
            </div>
            <div class="detail-stat">
                <div class="detail-stat-value" id="detailLat"></div>
                <div class="detail-stat-label">纬度</div>
            </div>
        </div>
        <div class="detail-desc" id="detailDesc"></div>
        <div class="detail-actions">
            <button class="detail-btn secondary" onclick="closeDetail()">关闭</button>
            <button class="detail-btn primary" onclick="editCurrentPoi()">编辑</button>
        </div>
    </div>

    <script>
var map, currentPoiId = null;
var appData = { pois: [], schedules: {} };

// Init
function initApp() {
    loadData();
    initMap();
    renderAll();
    
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-wrap')) document.getElementById('mainSearchResults').classList.remove('active');
        if (!e.target.closest('.addr-wrap')) document.getElementById('addrSugs').classList.remove('active');
    });
}

function loadData() {
    var stored = localStorage.getItem('sfDIY');
    if (stored) appData = JSON.parse(stored);
}

function initMap() {
    map = new AMap.create('#container', {
        zoom: 5,
        center: [103.7, 36.1]
    });
    appData.pois.forEach(function(p) { addMarker(p); });
    
    // Locate button
    map.plugin('AMap.ToolBar', function() {
        var toolbar = new AMap.ToolBar({ position: 'RB', offset: new AMap.Pixel(10, 60) });
        map.addControl(toolbar);
    });
}

// Markers
function addMarker(poi) {
    if (!poi.lng || !poi.lat) return;
    var icons = {relative:'👨‍👩‍👧‍👦',shopping:'🛒',ancestor:'🕯️',scenic:'🏞️',food:'🍜',custom:'🧧'};
    var colors = {relative:'#ff3b30',shopping:'#007aff',ancestor:'#34c759',scenic:'#af52de',food:'#ff9500',custom:'#8e8e93'};
    var marker = new AMap.Marker({
        position: [poi.lng, poi.lat],
        icon: new AMap.Icon({
            size: new AMap.Size(36, 36),
            image: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="' + (colors[poi.type]||'#ff3b30') + '"/><text x="18" y="24" text-anchor="middle" font-size="18">📍</text></svg>')
        }),
        title: poi.name
    });
    marker.on('click', function() { showDetail(poi); });
    map.add(marker);
}

// Panels
function showPanel(name) {
    hideAllPanels();
    document.getElementById(name + 'Panel').classList.add('active');
    document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
    event.currentTarget.classList.add('active');
    document.getElementById('fabBtn').classList.toggle('active', name === 'list' || name === 'map');
    if (name === 'map') {
        document.getElementById('mapPanel').innerHTML = '<div class="map-container" id="mapView"></div>';
        var view = new AMap.create('#mapView', { zoom: 10, center: [103.7, 36.1] });
        appData.pois.forEach(function(p) { if (p.lng && p.lat) { var m = new AMap.Marker({ position: [p.lng, p.lat], title: p.name }); m.on('click', function() { showDetail(p); }); view.add(m); } });
    }
}

function hideAllPanels() {
    document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
}

function renderAll() {
    renderList();
    renderScheduleList();
}

function renderList() {
    var container = document.getElementById('poiList');
    if (appData.pois.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📍</div><div class="empty-text">还没有添加地点</div></div>';
        return;
    }
    container.innerHTML = appData.pois.map(function(p) {
        var icons = {relative:'👨‍👩‍👧‍👦',shopping:'🛒',ancestor:'🕯️',scenic:'🏞️',food:'🍜',custom:'🧧'};
        var types = {relative:'走亲戚',shopping:'置办年货',ancestor:'祭祖上坟',scenic:'逛庙会',food:'吃年夜饭',custom:'其他'};
        return '<div class="item-card' + (p.type==='ancestor'?' ancestor':'') + '" onclick="showDetail(appData.pois.find(function(x){return x.id===\'' + p.id + '\'}))"><div class="item-card-header"><span class="item-name">' + (icons[p.type]||'📍') + ' ' + p.name + '</span><span class="item-tag' + (p.type==='ancestor'?' ancestor':'') + '">' + (types[p.type]||'其他') + '</span></div><div class="item-info">' + (p.address||'') + '</div></div>';
    }).join('');
}

function renderScheduleList() {
    var container = document.getElementById('scheduleList');
    var dates = Object.keys(appData.schedules).sort().reverse();
    var today = new Date().toISOString().split('T')[0];
    
    if (dates.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📅</div><div class="empty-text">还没有日程安排</div></div>';
        return;
    }
    
    container.innerHTML = '<button class="form-submit" style="margin-bottom:16px;background:linear-gradient(135deg,#34c759,#30d158);" onclick="openSchModal()">+ 添加日程</button>' + dates.map(function(date) {
        var items = appData.schedules[date];
        return '<div class="day-card"><div class="day-header"><span class="day-title">' + date + '</span><span class="day-label' + (date===today?' today':'') + '">' + (date===today?'今天':' ') + '</span></div>' + items.map(function(item) {
            return '<div class="schedule-item"><div class="sch-icon">' + item.icon + '</div><div class="sch-info"><div class="sch-name">' + item.name + '</div><div class="sch-time">' + (item.time||'') + ' ' + (item.location||'') + '</div></div><button class="sch-del" onclick="event.stopPropagation();delSch(\'' + date + '\',\'' + item.id + '\')">✕</button></div>';
        }).join('') + '</div>';
    }).join('');
}

// Poi Modal
function openPoiModal(poi) {
    document.getElementById('editPoiId').value = poi ? poi.id : '';
    document.getElementById('poiModalTitle').textContent = poi ? '编辑地点' : '添加地点';
    document.getElementById('inpName').value = poi ? poi.name : '';
    document.getElementById('selType').value = poi ? poi.type : 'custom';
    document.getElementById('inpAddr').value = poi ? (poi.address||'') : '';
    document.getElementById('selLng').value = poi ? (poi.lng||'') : '';
    document.getElementById('selLat').value = poi ? (poi.lat||'') : '';
    document.getElementById('inpTags').value = poi ? (poi.tags||[]).join(',') : '';
    document.getElementById('inpDesc').value = poi ? (poi.desc||'') : '';
    document.getElementById('delPoiBtn').style.display = poi ? 'block' : 'none';
    document.getElementById('poiModal').classList.add('active');
    document.getElementById('addrSugs').classList.remove('active');
}

function closePoiModal() { document.getElementById('poiModal').classList.remove('active'); }

function submitPoi() {
    var name = document.getElementById('inpName').value.trim();
    if (!name) { alert('请填写名称'); return; }
    
    var id = document.getElementById('editPoiId').value || ('p_' + Date.now());
    var isNew = !document.getElementById('editPoiId').value;
    var poi = {
        id: id,
        name: name,
        type: document.getElementById('selType').value,
        address: document.getElementById('inpAddr').value.trim(),
        lng: parseFloat(document.getElementById('selLng').value) || null,
        lat: parseFloat(document.getElementById('selLat').value) || null,
        tags: document.getElementById('inpTags').value.split(',').map(function(t){return t.trim();}).filter(function(t){return t;}),
        desc: document.getElementById('inpDesc').value.trim(),
        icon: '📍'
    };
    
    if (isNew) appData.pois.push(poi);
    else { var idx = appData.pois.findIndex(function(p){return p.id===id;}); if(idx>-1) appData.pois[idx]=poi; }
    
    saveData();
    map && map.clearMap();
    appData.pois.forEach(function(p) { addMarker(p); });
    renderAll();
    closePoiModal();
}

function delPoi() {
    var id = document.getElementById('editPoiId').value;
    if (!id || !confirm('确定删除这个地点吗？')) return;
    appData.pois = appData.pois.filter(function(p) { return p.id !== id; });
    saveData();
    map && map.clearMap();
    appData.pois.forEach(function(p) { addMarker(p); });
    renderAll();
    closePoiModal();
    closeDetail();
}

// Detail
function showDetail(poi) {
    currentPoiId = poi.id;
    var icons = {relative:'👨‍👩‍👧‍👦',shopping:'🛒',ancestor:'🕯️',scenic:'🏞️',food:'🍜',custom:'🧧'};
    var types = {relative:'走亲戚',shopping:'置办年货',ancestor:'祭祖上坟',scenic:'逛庙会',food:'吃年夜饭',custom:'其他'};
    var colors = {relative:'#ff3b30',shopping:'#007aff',ancestor:'#34c759',scenic:'#af52de',food:'#ff9500',custom:'#8e8e93'};
    document.getElementById('detailTitle').textContent = (icons[poi.type]||'📍') + ' ' + poi.name;
    document.getElementById('detailType').textContent = poi.address || types[poi.type] || '其他';
    document.getElementById('detailLng').textContent = poi.lng || '-';
    document.getElementById('detailLat').textContent = poi.lat || '-';
    document.getElementById('detailDesc').textContent = poi.desc || '';
    var tagsHtml = (poi.tags||[]).map(function(t) {
        return '<span class="detail-tag" style="background:' + (colors[poi.type]||'#8e8e93') + '22;color:' + (colors[poi.type]||'#8e8e93') + '">' + t + '</span>';
    }).join('');
    document.getElementById('detailTags').innerHTML = tagsHtml;
    document.getElementById('detailCard').classList.add('active');
    if (poi.lng && poi.lat) map && map.setCenter([poi.lng, poi.lat]);
}

function closeDetail() { document.getElementById('detailCard').classList.remove('active'); }

function editCurrentPoi() {
    closeDetail();
    var poi = appData.pois.find(function(p){return p.id===currentPoiId;});
    if (poi) openPoiModal(poi);
}

// Schedule Modal
function openSchModal() {
    document.getElementById('schName').value = '';
    document.getElementById('schTime').value = '';
    document.getElementById('schDate').value = new Date().toISOString().split('T')[0];
    var sel = document.getElementById('schPoiSel');
    sel.innerHTML = '<option value="">无</option>' + appData.pois.map(function(p) {
        return '<option value="' + p.id + '">' + p.name + '</option>';
    }).join('');
    document.getElementById('schModal').classList.add('active');
}

function closeSchModal() { document.getElementById('schModal').classList.remove('active'); }

function submitSch() {
    var name = document.getElementById('schName').value.trim();
    var date = document.getElementById('schDate').value;
    if (!name || !date) { alert('请填写名称和日期'); return; }
    
    var time = document.getElementById('schTime').value;
    var poiId = document.getElementById('schPoiSel').value;
    var poi = poiId ? appData.pois.find(function(p) { return p.id === poiId; }) : null;
    var type = poi ? poi.type : 'custom';
    var icons = {relative:'👨‍👩‍👧‍👦',shopping:'🛒',ancestor:'🕯️',scenic:'🏞️',food:'🍜',custom:'🧧'};
    
    var item = {
        id: 's_' + Date.now(),
        name: name, time: time, type: type,
        icon: icons[type] || '📌',
        location: poi ? poi.name : '',
        poiId: poiId || ''
    };
    
    if (!appData.schedules[date]) appData.schedules[date] = [];
    appData.schedules[date].push(item);
    appData.schedules[date].sort(function(a,b) { return (a.time||'00:00').localeCompare(b.time||'00:00'); });
    
    saveData();
    renderScheduleList();
    closeSchModal();
}

function delSch(date, id) {
    if (!appData.schedules[date]) return;
    appData.schedules[date] = appData.schedules[date].filter(function(i){return i.id!==id;});
    if (appData.schedules[date].length === 0) delete appData.schedules[date];
    saveData();
    renderScheduleList();
}

// Main search
document.getElementById('mainSearch').addEventListener('input', function() {
    var val = this.value.trim();
    if (val.length < 1) { document.getElementById('mainSearchResults').classList.remove('active'); return; }
    var results = appData.pois.filter(function(p) {
        return p.name.includes(val) || (p.tags&&p.tags.some(function(t){return t.includes(val);})) || (p.address&&p.address.includes(val));
    });
    var container = document.getElementById('mainSearchResults');
    if (results.length === 0) {
        container.innerHTML = '<div class="sug-item"><div class="sug-name">无匹配结果</div></div>';
    } else {
        container.innerHTML = results.map(function(p) {
            var icons = {relative:'👨‍👩‍👧‍👦',shopping:'🛒',ancestor:'🕯️',scenic:'🏞️',food:'🍜',custom:'🧧'};
            return '<div class="sug-item" onclick="mainSelPoi(\'' + p.id + '\')"><div class="sug-name">' + (icons[p.type]||'📍') + ' ' + p.name + '</div><div class="sug-addr">' + (p.address||'') + '</div></div>';
        }).join('');
    }
    container.classList.add('active');
});

function mainSelPoi(id) {
    document.getElementById('mainSearchResults').classList.remove('active');
    document.getElementById('mainSearch').value = '';
    var poi = appData.pois.find(function(p) { return p.id === id; });
    if (poi) showDetail(poi);
}

// ==================== 高德地址搜索（实时搜索）====================
var addrSearchTimer = null;

document.getElementById('inpAddr').addEventListener('input', function() {
    clearTimeout(addrSearchTimer);
    var keyword = this.value.trim();
    if (keyword.length < 2) {
        document.getElementById('addrSugs').classList.remove('active');
        return;
    }
    addrSearchTimer = setTimeout(function() { doAddrSearch(keyword); }, 500);
});

document.getElementById('inpAddr').addEventListener('focus', function() {
    var keyword = this.value.trim();
    if (keyword.length >= 2) doAddrSearch(keyword);
});

function doAddrSearch(keyword) {
    var container = document.getElementById('addrSugs');
    // 显示加载状态
    container.innerHTML = '<div class="addr-sug"><div class="addr-sug-name" style="color:#ff9500">搜索中...</div></div>';
    container.classList.add('active');
    
    // 使用高德 PlaceSearch 插件
    AMap.plugin('AMap.PlaceSearch', function () {
        var placeSearch = new AMap.PlaceSearch({
            city: '',       // 空字符串代表全国
            citylimit: false,
            pageSize: 8
        });
        
        placeSearch.search(keyword, function (status, result) {
            console.log('PlaceSearch结果:', status, result);
            
            if (status === 'complete' && result && result.poiList && result.poiList.pois && result.poiList.pois.length > 0) {
                var pois = result.poiList.pois;
                container.innerHTML = pois.map(function (p) {
                    var name = p.name || '';
                    var address = p.address || '';
                    var lng = p.location ? p.location.lng : '';
                    var lat = p.location ? p.location.lat : '';
                    var escapedName = name.replace(/'/g, "\\'");
                    var escapedAddr = address.replace(/'/g, "\\'");
                    return '<div class="addr-sug" onclick="selAddrSug(\'' + escapedName + '\',' + lng + ',' + lat + ',\'' + escapedAddr + '\')">' +
                        '<div class="addr-sug-name">' + name + '</div>' +
                        '<div class="addr-sug-addr">' + address + '</div></div>';
                }).join('');
                container.classList.add('active');
            } else {
                container.innerHTML = '<div class="addr-sug"><div class="addr-sug-name" style="color:rgba(255,255,255,0.5)">未找到相关地点(' + status + ')</div></div>';
                container.classList.add('active');
            }
        });
    });
}

function selAddrSug(name, lng, lat, address) {
    document.getElementById('inpAddr').value = name;
    document.getElementById('selLng').value = lng;
    document.getElementById('selLat').value = lat;
    document.getElementById('addrSugs').classList.remove('active');
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.addr-wrap')) {
        document.getElementById('addrSugs').classList.remove('active');
    }
});
// =================================================================

function saveData() {
    localStorage.setItem('sfDIY', JSON.stringify(appData));
}

window.onload = initApp;
