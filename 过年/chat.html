<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Web Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #13131f;
      --bg-tertiary: #1a1a2e;
      --bg-hover: #252540;
      --border-color: #2a2a45;
      --text-primary: #e8e8f0;
      --text-secondary: #a0a0b8;
      --accent: #7c6cff;
      --accent-hover: #9b8fff;
      --user-msg-bg: linear-gradient(135deg, #7c6cff 0%, #6b5ce7 100%);
      --ai-msg-bg: #1a1a2e;
      --code-bg: #0d0d1a;
      --success: #4ade80;
      --error: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .sidebar-header .logo {
      width: 32px; height: 32px;
      background: var(--user-msg-bg);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
    }
    .sidebar-header h1 {
      font-size: 16px; font-weight: 600;
      letter-spacing: 0.5px;
    }
    .new-chat-btn {
      background: var(--user-msg-bg);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex; align-items: center; gap: 8px;
    }
    .new-chat-btn:hover { opacity: 0.9; }
    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s;
      border: 1px solid transparent;
    }
    .session-item:hover { background: var(--bg-hover); }
    .session-item.active {
      background: var(--bg-tertiary);
      border-color: var(--border-color);
      color: var(--text-primary);
    }
    .session-item .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-item .delete-btn {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .session-item:hover .delete-btn { opacity: 1; }
    .session-item .delete-btn:hover { color: var(--error); background: rgba(248,113,113,0.1); }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(12px);
    }
    .top-bar .model-info {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .top-bar .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .top-bar .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    .top-bar .status-dot.offline { background: var(--error); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .welcome {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    .welcome h2 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      background: var(--user-msg-bg);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .welcome p { font-size: 15px; line-height: 1.6; max-width: 480px; margin: 0 auto; }
    .message {
      display: flex;
      gap: 14px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .message.user .avatar { background: var(--user-msg-bg); color: white; }
    .message.ai .avatar { background: var(--bg-tertiary); color: var(--accent); border: 1px solid var(--border-color); }
    .message .content {
      flex: 1;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
    }
    .message.user { flex-direction: row-reverse; }
    .message.user .content {
      background: var(--user-msg-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.ai .content {
      background: var(--ai-msg-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }
    .message.ai .content pre {
      background: var(--code-bg);
      border-radius: 8px;
      padding: 14px;
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid var(--border-color);
    }
    .message.ai .content code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .message.ai .content p { margin: 8px 0; }
    .message.ai .content p:first-child { margin-top: 0; }
    .message.ai .content p:last-child { margin-bottom: 0; }
    .message.ai .content ul, .message.ai .content ol {
      margin: 8px 0;
      padding-left: 20px;
    }
    .message.ai .content li { margin: 4px 0; }
    .message.ai .content blockquote {
      border-left: 3px solid var(--accent);
      margin: 10px 0;
      padding-left: 14px;
      color: var(--text-secondary);
    }
    .message.ai .content table {
      border-collapse: collapse;
      margin: 10px 0;
      width: 100%;
    }
    .message.ai .content th, .message.ai .content td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .message.ai .content th { background: var(--bg-hover); }
    .input-area {
      padding: 16px 24px 24px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    .input-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .input-box:focus-within { border-color: var(--accent); }
    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      max-height: 200px;
      font-family: inherit;
    }
    .input-box textarea::placeholder { color: var(--text-secondary); }
    .input-box button {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: var(--user-msg-bg);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .input-box button:hover { opacity: 0.85; }
    .input-box button:disabled { opacity: 0.4; cursor: not-allowed; }
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }
    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-primary);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--error); color: var(--error); }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .chat-area { padding: 16px; }
      .input-area { padding: 12px 16px 16px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">H</div>
      <h1>Hermes Chat</h1>
    </div>
    <button class="new-chat-btn" onclick="newSession()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      新建对话
    </button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <div class="model-info" id="modelInfo">Hermes Agent &middot; deepseek-chat</div>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">连接中...</span>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <h2>⚕ Hermes Agent</h2>
        <p>基于 DeepSeek + Kimi 双模型驱动<br>支持代码执行、文件操作、网页浏览等工具调用</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="输入消息... (Shift+Enter 换行, Enter 发送)" onkeydown="handleKeydown(event)" oninput="autoResize(this)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = 'http://127.0.0.1:8642';
    const STORAGE_KEY = 'hermes_web_chat_sessions';
    const CURRENT_KEY = 'hermes_web_chat_current';

    let sessions = [];
    let currentId = null;
    let isStreaming = false;
    let abortController = null;

    // Init
    loadSessions();
    checkHealth();
    setInterval(checkHealth, 5000);
    renderSessionList();

    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        sessions = raw ? JSON.parse(raw) : [];
        currentId = localStorage.getItem(CURRENT_KEY);
      } catch { sessions = []; currentId = null; }
      if (!sessions.length) newSession();
      else if (currentId) loadSession(currentId);
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      if (currentId) localStorage.setItem(CURRENT_KEY, currentId);
    }

    function newSession() {
      const id = 'sess_' + Date.now().toString(36);
      const session = { id, title: '新对话', messages: [], created: Date.now() };
      sessions.unshift(session);
      currentId = id;
      saveSessions();
      renderSessionList();
      renderChat();
      document.getElementById('userInput').focus();
    }

    function loadSession(id) {
      currentId = id;
      saveSessions();
      renderSessionList();
      renderChat();
    }

    function deleteSession(id, e) {
      e.stopPropagation();
      sessions = sessions.filter(s => s.id !== id);
      if (currentId === id) {
        currentId = sessions[0]?.id || null;
        if (!currentId) newSession();
      }
      saveSessions();
      renderSessionList();
      if (currentId) loadSession(currentId);
      else renderChat();
    }

    function renderSessionList() {
      const el = document.getElementById('sessionList');
      el.innerHTML = sessions.map(s => `
        <div class="session-item ${s.id === currentId ? 'active' : ''}" onclick="loadSession('${s.id}')">
          <span class="title">${escapeHtml(s.title)}</span>
          <button class="delete-btn" onclick="deleteSession('${s.id}', event)">×</button>
        </div>
      `).join('');
    }

    function renderChat() {
      const area = document.getElementById('chatArea');
      const session = sessions.find(s => s.id === currentId);
      if (!session || !session.messages.length) {
        area.innerHTML = `
          <div class="welcome">
            <h2>⚕ Hermes Agent</h2>
            <p>基于 DeepSeek + Kimi 双模型驱动<br>支持代码执行、文件操作、网页浏览等工具调用</p>
          </div>`;
        return;
      }
      area.innerHTML = session.messages.map(m => renderMessage(m)).join('');
      area.scrollTop = area.scrollHeight;
      hljs.highlightAll();
    }

    function renderMessage(msg, isStreaming = false) {
      const isUser = msg.role === 'user';
      const content = isUser ? escapeHtml(msg.content) : marked.parse(msg.content);
      const avatar = isUser ? '我' : 'H';
      return `
        <div class="message ${isUser ? 'user' : 'ai'}" id="${msg.id || ''}">
          <div class="avatar">${avatar}</div>
          <div class="content">${content}${isStreaming ? '<div class="typing-indicator"><span></span><span></span><span></span></div>' : ''}</div>
        </div>
      `;
    }

    function appendMessage(role, content) {
      const session = sessions.find(s => s.id === currentId);
      if (!session) return;
      const msg = { id: 'msg_' + Date.now().toString(36), role, content };
      session.messages.push(msg);
      if (session.messages.length === 1) {
        session.title = content.slice(0, 20).replace(/\n/g, ' ') || '新对话';
      }
      saveSessions();
      renderSessionList();
      return msg;
    }

    function updateLastMessage(content) {
      const session = sessions.find(s => s.id === currentId);
      if (!session || !session.messages.length) return;
      session.messages[session.messages.length - 1].content = content;
      saveSessions();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const btn = document.getElementById('sendBtn');
      const text = input.value.trim();
      if (!text || isStreaming) return;

      input.value = '';
      input.style.height = 'auto';
      appendMessage('user', text);
      renderChat();

      isStreaming = true;
      btn.disabled = true;
      const aiMsg = appendMessage('assistant', '');
      renderChat();

      const session = sessions.find(s => s.id === currentId);
      const history = session.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));

      abortController = new AbortController();
      let buffer = '';

      try {
        const res = await fetch(`${API_BASE}/v1/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'hermes-agent',
            messages: history,
            stream: true
          }),
          signal: abortController.signal
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `HTTP ${res.status}`);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let done = false;

        while (!done) {
          const { value, done: d } = await reader.read();
          done = d;
          if (!value) continue;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') { done = true; break; }
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (delta) {
                buffer += delta;
                aiMsg.content = buffer;
                updateLastMessage(buffer);
                // Update DOM directly for smooth streaming
                const msgEl = document.getElementById(aiMsg.id);
                if (msgEl) {
                  msgEl.querySelector('.content').innerHTML = marked.parse(buffer) +
                    '<div class="typing-indicator"><span></span><span></span><span></span></div>';
                  hljs.highlightAll();
                }
                scrollToBottom();
              }
            } catch {}
          }
        }

        aiMsg.content = buffer;
        updateLastMessage(buffer);
        renderChat();
      } catch (e) {
        if (e.name === 'AbortError') {
          aiMsg.content = buffer || '(已取消)';
        } else {
          aiMsg.content = `❌ 错误: ${e.message}`;
        }
        updateLastMessage(aiMsg.content);
        renderChat();
        showToast(e.name === 'AbortError' ? '已取消' : e.message, true);
      } finally {
        isStreaming = false;
        btn.disabled = false;
        abortController = null;
      }
    }

    function scrollToBottom() {
      const area = document.getElementById('chatArea');
      area.scrollTop = area.scrollHeight;
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function checkHealth() {
      const dot = document.getElementById('statusDot');
      const txt = document.getElementById('statusText');
      try {
        const res = await fetch(`${API_BASE}/health`, { method: 'GET' });
        if (res.ok) {
          dot.classList.remove('offline');
          txt.textContent = '已连接';
        } else throw new Error();
      } catch {
        dot.classList.add('offline');
        txt.textContent = '未连接 - 请启动 hermes gateway';
      }
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', isError);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Configure marked
    marked.setOptions({
      breaks: true,
      gfm: true,
      headerIds: false,
      mangle: false
    });
  </script>
</body>
</html>
