<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" style="background:#0a0d14">
  <defs>
    <style>
      text { font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { font-size:22px; font-weight:bold; fill:#ffd700; }
      .zone { font-size:10px; fill:#e2e8f0; text-anchor:middle; }
      .zdesc { font-size:9px; fill:#8892a8; text-anchor:middle; }
    </style>
  </defs>
  
  <text x="250" y="30" text-anchor="middle" class="title">✋ 手掌九丘分布图</text>
  <text x="250" y="50" text-anchor="middle" class="zdesc" fill="#556074">指根下方各丘对应不同人生领域</text>

  <!-- Whole palm outline -->
  <path d="M220,60 L280,60 Q300,70 310,80 L330,120 L350,160 L370,200 
           L380,280 L370,350 L350,420 L320,480 L280,520 
           L250,535 L220,520 L180,480 L150,420 L130,350 
           L120,280 L130,200 L150,160 L170,120 L190,80 Q200,70 220,60" 
        fill="#11141e" stroke="#2a3347" stroke-width="2"/>

  <!-- Fingers -->
  <!-- Index finger -->
  <path d="M190,80 L210,60 L220,10 L240,5 L250,15 L260,5 L270,10 L280,60 L290,80" fill="#11141e" stroke="#2a3347" stroke-width="1.5"/>
  <!-- Middle finger -->
  <path d="M225,60 L240,25 L245,-10 L255,-15 L260,-5 L265,-15 L275,-10 L280,25 L290,60" fill="#11141e" stroke="#2a3347" stroke-width="1.5"/>
  <!-- Ring finger -->
  <path d="M270,65 L285,30 L295,0 L305,-5 L310,5 L315,-5 L325,0 L330,30 L335,65" fill="#11141e" stroke="#2a3347" stroke-width="1.5"/>
  <!-- Pinky -->
  <path d="M305,80 L320,45 L340,20 L350,15 L355,25 L360,15 L370,20 L380,45 L385,80" fill="#11141e" stroke="#2a3347" stroke-width="1.5"/>
  <!-- Thumb -->
  <path d="M180,100 L155,130 L130,160 L115,190 L110,210 L100,195 L95,175 L100,155 L120,120 L145,90 L170,70" fill="#11141e" stroke="#2a3347" stroke-width="1.5"/>

  <!-- Finger labels -->
  <text x="140" y="195" class="zone" fill="#4a9eff" font-size="9px">拇指</text>
  <text x="170" y="210" class="zdesc" fill="#4a9eff" font-size="7px">意志力</text>
  
  <text x="230" y="-20" class="zone" fill="#f59e0b" font-size="9px">中指</text>
  <text x="230" y="-10" class="zdesc" fill="#f59e0b" font-size="7px">土星指</text>
  
  <text x="295" y="3" class="zone" fill="#f59e0b" font-size="9px">无名指</text>
  <text x="295" y="13" class="zdesc" fill="#f59e0b" font-size="7px">太阳指</text>
  
  <text x="342" y="18" class="zone" fill="#f59e0b" font-size="9px">小指</text>
  <text x="342" y="28" class="zdesc" fill="#f59e0b" font-size="7px">水星指</text>

  <!-- 1. 木星丘 (食指根下) -->
  <ellipse cx="215" cy="120" rx="35" ry="25" fill="rgba(74,158,255,0.15)" stroke="#4a9eff" stroke-width="1"/>
  <text x="215" y="118" class="zone" fill="#4a9eff">木星丘</text>
  <text x="215" y="132" class="zdesc" fill="#4a9eff">·进取心·社交·</text>

  <!-- 2. 土星丘 (中指根下) -->
  <ellipse cx="250" cy="110" rx="30" ry="20" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1"/>
  <text x="250" y="108" class="zone" fill="#f59e0b">土星丘</text>
  <text x="250" y="122" class="zdesc" fill="#f59e0b">·责任感·稳健·</text>

  <!-- 3. 太阳丘 (无名指根下) -->
  <ellipse cx="295" cy="120" rx="30" ry="22" fill="rgba(240,192,80,0.15)" stroke="#f0c050" stroke-width="1"/>
  <text x="295" y="118" class="zone" fill="#f0c050">太阳丘</text>
  <text x="295" y="132" class="zdesc" fill="#f0c050">·才华·名气·</text>

  <!-- 4. 水星丘 (小指根下) -->
  <ellipse cx="340" cy="135" rx="25" ry="20" fill="rgba(61,214,140,0.15)" stroke="#3dd68c" stroke-width="1"/>
  <text x="340" y="133" class="zone" fill="#3dd68c">水星丘</text>
  <text x="340" y="147" class="zdesc" fill="#3dd68c">·沟通·商业·</text>

  <!-- 5. 金星丘 (拇指根下) -->
  <ellipse cx="150" cy="240" rx="35" ry="50" fill="rgba(240,96,96,0.15)" stroke="#f06060" stroke-width="1" transform="rotate(-15,150,240)"/>
  <text x="145" y="230" class="zone" fill="#f06060">金星丘</text>
  <text x="145" y="248" class="zdesc" fill="#f06060">·生命力·情感·</text>

  <!-- 6. 月丘 (掌外缘下) -->
  <ellipse cx="355" cy="280" rx="25" ry="45" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1" transform="rotate(10,355,280)"/>
  <text x="355" y="272" class="zone" fill="#a855f7">月丘</text>
  <text x="355" y="288" class="zdesc" fill="#a855f7">·想象力·直觉·</text>

  <!-- 7. 上火星丘 (掌心上外侧) -->
  <ellipse cx="285" cy="200" rx="35" ry="30" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
  <text x="285" y="198" class="zone" fill="#f59e0b">上火星丘</text>
  <text x="285" y="212" class="zdesc" fill="#f59e0b">·勇气·斗志·</text>

  <!-- 8. 下火星丘 (掌心下外侧) -->
  <ellipse cx="320" cy="350" rx="30" ry="28" fill="rgba(245,158,11,0.10)" stroke="#f59e0b" stroke-width="1"/>
  <text x="320" y="348" class="zone" fill="#f59e0b">下火星丘</text>
  <text x="320" y="362" class="zdesc" fill="#f59e0b">·执行力·坚持·</text>

  <!-- 9. 地丘 (掌根中部) -->
  <ellipse cx="250" cy="450" rx="45" ry="35" fill="rgba(61,214,140,0.15)" stroke="#3dd68c" stroke-width="1"/>
  <text x="250" y="448" class="zone" fill="#3dd68c">地丘</text>
  <text x="250" y="462" class="zdesc" fill="#3dd68c">·根基·晚年·健康·</text>

  <!-- Three major lines -->
  <!-- Life line -->
  <path d="M215,120 Q175,200 160,320 Q155,380 180,450" stroke="#4a9eff" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="118" y="470" class="zdesc" fill="#4a9eff" font-size="7px">生命线</text>

  <!-- Head line -->
  <path d="M215,130 Q240,150 280,180 Q320,200 360,220" stroke="#f0c050" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="365" y="215" class="zdesc" fill="#f0c050" font-size="7px">智慧线</text>

  <!-- Heart line -->
  <path d="M340,140 Q310,130 280,115 Q240,100 200,100" stroke="#f06060" stroke-width="1.5" fill="none" opacity="0.6"/>
  <text x="190" y="95" class="zdesc" fill="#f06060" font-size="7px">感情线</text>

  <!-- Legend box -->
  <rect x="60" y="500" width="380" height="80" rx="8" fill="#11141e" stroke="#2a3347" stroke-width="1"/>
  <text x="250" y="518" text-anchor="middle" style="font-size:11px;font-weight:bold;fill:#e2e8f0">掌丘吉凶总则</text>
  <text x="80" y="538" style="font-size:9px;fill:#e2e8f0">↗ 隆起饱满 = 该领域能量充沛·运势好</text>
  <text x="80" y="555" style="font-size:9px;fill:#e2e8f0">→ 均匀隆起 = 平衡和谐·最佳状态</text>
  <text x="80" y="572" style="font-size:9px;fill:#e2e8f0">↘ 扁平凹陷 = 该领域能量不足·运势弱</text>
</svg>
