    clearMarkers();
    beaches.forEach(beach => markers.push(createMarker(beach.location, beach.name, 'beach', beach.icon, beach)));
    islands.forEach(island => markers.push(createMarker(island.location, island.name, 'island', island.icon, island)));
    foods.forEach(food => markers.push(createMarker(food.location, food.name, 'food', food.icon, food)));
}

function createMarker(position, title, type, icon, data) {
    const div = document.createElement('div');
    div.className = 'custom-marker marker-' + type;
    div.innerHTML = icon;
    div.style.cssText = 'width:36px;height:36px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.2);cursor:pointer;font-size:18px;border:3px solid ' + (type === 'beach' ? '#ff3b30' : type === 'island' ? '#007aff' : '#ff9500');
    const marker = new AMap.Marker({ position: position, title: title, content: div, offset: new AMap.Pixel(-18, -18) });
    marker.on('click', function() { showInfoCard(data); });
    map.add(marker);
    return marker;
}

function clearMarkers() { markers.forEach(marker => map.remove(marker)); markers = []; }

function renderBeachList() {
    const container = document.getElementById('beachList');
    container.innerHTML = beaches.map((beach, index) => '<div class="beach-item" onclick="toggleBeachDetail(' + index + ', this)"><div class="beach-header"><span class="beach-name">' + beach.name + '</span><span class="beach-status status-' + beach.status + '">' + beach.crowd + '</span></div><div class="beach-details"><div class="detail-row"><span class="detail-label">路况</span><span class="detail-value">' + beach.road + '</span></div><div class="detail-row"><span class="detail-label">距离</span><span class="detail-value">' + beach.distance + '</span></div><div class="detail-row"><span class="detail-label">预计时间</span><span class="detail-value">' + beach.time + '</span></div><div class="detail-row"><span class="detail-label">评分</span><span class="detail-value">' + beach.score + '分</span></div></div></div>').join('');
}

function toggleBeachDetail(index, element) {
    const isExpanded = element.classList.contains('expanded');
    document.querySelectorAll('.beach-item').forEach(item => item.classList.remove('expanded'));
    if (!isExpanded) { element.classList.add('expanded'); map.setCenter(beaches[index].location); map.setZoom(15); }
}

function renderHighwayList() {
    const container = document.getElementById('highwayList');
    container.innerHTML = highways.map((hw, index) => '<div class="road-item highway-item" onclick="toggleRoadDetail(' + index + ', this, \'highway\')"><span class="road-name">' + hw.name + '</span><span class="road-status status-' + (hw.status === 'congested' ? 'crowded' : hw.status === 'slow' ? 'moderate' : 'quiet') + '">' + hw.level + '</span><div class="road-details"><div class="detail-row"><span class="detail-label">平均车速</span><span class="detail-value">' + hw.speed + '</span></div><div class="detail-row"><span class="detail-label">路况信息</span><span class="detail-value">' + hw.desc + '</span></div><div style="margin-top:8px;font-size:12px;color:#8e8e93">涉及路段: ' + hw.roads.join('、') + '</div></div></div>').join('');
}

function renderCityRoadList() {
    const container = document.getElementById('cityRoadList');
    let html = '';
    for (const [district, roads] of Object.entries(cityRoads)) {
        html += '<div class="district-group"><div class="district-title">' + district + ' (' + roads.length + '条)</div><div class="road-list">' + roads.map((road, idx) => { const status = Math.random() > 0.6 ? 'congested' : Math.random() > 0.3 ? 'slow' : 'smooth'; const statusText = status === 'congested' ? '拥堵' : status === 'slow' ? '缓行' : '畅通'; return '<div class="road-item cityroad-item" onclick="toggleRoadDetail(\'' + district + '_' + idx + '\', this, \'city\')"><span class="road-name">' + road + '</span><span class="road-status status-' + (status === 'congested' ? 'crowded' : status === 'slow' ? 'moderate' : 'quiet') + '">' + statusText + '</span><div class="road-details"><div class="detail-row"><span class="detail-label">拥堵指数</span><span class="detail-value">' + (Math.random() * 10).toFixed(1) + '</span></div><div class="detail-row"><span class="detail-label">平均车速</span><span class="detail-value">' + Math.floor(Math.random() * 40 + 20) + 'km/h</span></div><div class="detail-row"><span class="detail-label">预计延误</span><span class="detail-value">' + Math.floor(Math.random() * 15) + '分钟</span></div></div></div>'; }).join('') + '</div></div>';
    }
    container.innerHTML = html;
}

function toggleRoadDetail(index, element, type) {
    const details = element.querySelector('.road-details');
    const isExpanded = details.style.display === 'block';
    if (type === 'highway') { document.querySelectorAll('#highwayList .road-item').forEach(item => { item.querySelector('.road-details').style.display = 'none'; item.classList.remove('expanded'); }); }
    else { document.querySelectorAll('#cityRoadList .road-item').forEach(item => { item.querySelector('.road-details').style.display = 'none'; item.classList.remove('expanded'); }); }
    if (!isExpanded) { details.style.display = 'block'; element.classList.add('expanded'); }
}

function showInfoCard(data) {
    currentPoi = data;
    document.getElementById('cardImage').src = data.image;
    document.getElementById('cardTitle').textContent = data.name;
    const tagColors = { crowded: '#ff3b30', moderate: '#ff9500', quiet: '#34c759' };
    const tagTexts = { crowded: '🔴 拥挤', moderate: '🟡 适中', quiet: '🟢 稀疏' };
    document.getElementById('cardTags').innerHTML = '<span class="card-tag" style="background:' + tagColors[data.status] + '20;color:' + tagColors[data.status] + '">' + tagTexts[data.status] + '</span><span class="card-tag" style="background:#007aff20;color:#007aff">⭐ ' + data.score + '分</span><span class="card-tag" style="background:#5856d620;color:#5856d6">🌡️ ' + data.temp + '</span>';
    document.getElementById('cardStats').innerHTML = '<div class="stat-item"><div class="stat-value">' + data.crowd + '</div><div class="stat-label">人流</div></div><div class="stat-item"><div class="stat-value">' + data.road + '</div><div class="stat-label">路况</div></div><div class="stat-item"><div class="stat-value">' + data.distance + '</div><div class="stat-label">距离</div></div><div class="stat-item"><div class="stat-value">' + data.time + '</div><div class="stat-label">时间</div></div><div class="stat-item"><div class="stat-value">' + data.temp + '</div><div class="stat-label">温度</div></div><div class="stat-item"><div class="stat-value">' + data.score + '</div><div class="stat-label">评分</div></div>';
    document.getElementById('cardDesc').textContent = data.desc;
    document.getElementById('overlay').classList.add('active');
    document.getElementById('infoCard').classList.add('active');
    if (data.location) { map.setCenter(data.location); map.setZoom(16); }
}

function closeCard() { document.getElementById('overlay').classList.remove('active'); document.getElementById('infoCard').classList.remove('active'); }

function startNavigation() { if (currentPoi && currentPoi.location) { window.open('https://uri.amap.com/navigation?to=' + currentPoi.location[0] + ',' + currentPoi.location[1] + ',' + encodeURIComponent(currentPoi.name) + '&mode=car&policy=1', '_blank'); } }

function performLocalSearch(keyword) { const results = localLibrary.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase())); displaySearchResults(results, keyword); }
function performSearch() { const keyword = document.getElementById('searchInput').value.trim(); if (!keyword) return; const localResults = localLibrary.filter(item => item.name.toLowerCase().includes(keyword.toLowerCase())); if (localResults.length > 0) displaySearchResults(localResults, keyword); else performAMapSearch(keyword); }
function performAMapSearch(keyword) { const placeSearch = new AMap.PlaceSearch({ city: '北海', pageSize: 10 }); placeSearch.search(keyword, function(status, result) { if (status === 'complete' && result.info === 'OK') { const pois = result.poiList.pois.map(poi => ({ name: poi.name, type: 'search', location: [poi.location.lng, poi.location.lat], address: poi.address })); displaySearchResults(pois, keyword, true); } else { document.getElementById('searchResults').innerHTML = '<div class="search-result-item"><div class="result-name">未找到相关地点</div></div>'; document.getElementById('searchResults').classList.add('active'); } }); }
function displaySearchResults(results, keyword, isAMap) { const container = document.getElementById('searchResults'); if (results.length === 0) container.innerHTML = '<div class="search-result-item"><div class="result-name">未找到相关地点</div></div>'; else container.innerHTML = results.map(item => '<div class="search-result-item" onclick="selectSearchResult(\'' + item.name + '\', [' + item.location + '])"><div class="result-name">' + item.name + '</div>' + (item.address ? '<div class="result-address">' + item.address + '</div>' : '') + '</div>').join(''); container.classList.add('active'); }
function selectSearchResult(name, location) { document.getElementById('searchInput').value = name; document.getElementById('searchResults').classList.remove('active'); map.setCenter(location); map.setZoom(16); const marker = new AMap.Marker({ position: location, title: name }); map.add(marker); setTimeout(() => map.remove(marker), 5000); }
function toggleLayerMenu() { document.getElementById('layerMenu').classList.toggle('active'); }
function switchMapStyle(style) { const styles = { normal: 'amap://styles/normal', satellite: 'amap://styles/satellite', traffic: 'amap://styles/whitesmoke', night: 'amap://styles/dark' }; map.setMapStyle(styles[style] || styles.normal); document.querySelectorAll('.layer-option').forEach(opt => opt.classList.remove('active')); event.target.classList.add('active'); document.getElementById('layerMenu').classList.remove('active'); }
function locateMe() {
  map.plugin('AMap.Geolocation', function() {
    var geo = new AMap.Geolocation({
      enableHighAccuracy: true,
      timeout: 10000,
      buttonOffset: new AMap.Pixel(10, 20),
      zoomToAccuracy: true,
      showCircle: true,
      showMarker: true
    });
    geo.getCurrentPosition(function(status, result) {
      if (status === 'complete') {
        currentPos = [result.position.lng, result.position.lat];
        map.setCenter(currentPos);
        map.setZoom(15);
        updatePoiDistances();
        document.getElementById('locateFeedback').textContent = '✅ 已定位';
        setTimeout(function() { document.getElementById('locateFeedback').textContent = ''; }, 2000);
      } else {
        alert('定位失败，请检查位置权限');
      }
    });
  });
}

function updatePoiDistances() {
  if (!currentPos) return;
  var allPois = beaches.concat(islands).concat(foods);
  allPois.forEach(function(poi) {
    poi.distKm = getDist(poi.location);
    poi.distStr = formatDist(poi.distKm);
  });
  renderBeachList();
}

function getDist(pos) {
  var R = 6371;
  var dLat = (pos[1] - currentPos[1]) * Math.PI / 180;
  var dLon = (pos[0] - currentPos[0]) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(pos[1]*Math.PI/180)*Math.cos(currentPos[1]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(d) {
  if (d < 1) return Math.round(d * 1000) + 'm';
  return d.toFixed(1) + 'km';
}

function startNavigation() {
  if (!currentPoi || !currentPoi.location) return;
  var dest = currentPoi.location;
  var name = currentPoi.name;

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      var from = [pos.coords.longitude, pos.coords.latitude];
      showInlineRoute(from, dest, name);
    }, function() {
      showInlineRoute(null, dest, name);
    });
  } else {
    showInlineRoute(null, dest, name);
  }
}

function showInlineRoute(from, to, name) {
  var routePanel = document.getElementById('routePanel');
  var overlay = document.getElementById('overlay');

  if (!routePanel) {
    var panel = document.createElement('div');
    panel.id = 'routePanel';
    panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:white;z-index:3000;overflow-y:auto;display:none';
    document.body.appendChild(panel);
    routePanel = panel;
  }

  routePanel.style.display = 'block';
  routePanel.innerHTML = '<div style="padding:20px;height:100%;display:flex;flex-direction:column">' +
    '<div style="display:flex;align-items:center;margin-bottom:20px">' +
    '<button onclick="closeRoutePanel()" style="width:36px;height:36px;background:#f2f2f7;border:none;border-radius:50%;font-size:18px;margin-right:12px">←</button>' +
    '<span style="font-size:20px;font-weight:700">🗺️ 导航中</span></div>' +
    '<div id="routeMap" style="width:100%;height:45%;border-radius:16px;overflow:hidden;margin-bottom:16px"></div>' +
    '<div style="background:#f2f2f7;border-radius:16px;padding:16px;margin-bottom:12px">' +
    '<div style="font-size:16px;font-weight:600;margin-bottom:8px">目的地</div>' +
    '<div style="font-size:22px;font-weight:700;color:#007aff">' + name + '</div>' +
    '</div>' +
    '<div style="background:#f2f2f7;border-radius:16px;padding:16px;margin-bottom:12px" id="routeInfo">' +
    '<div style="font-size:14px;color:#8e8e93;margin-bottom:4px">路线规划中...</div>' +
    '</div>' +
    '<div style="margin-top:auto">' +
    '<a href="https://uri.amap.com/navigation?to=' + to[0] + ',' + to[1] + ',' + encodeURIComponent(name) + '&mode=driving&callnative=1" ' +
    'style="display:block;background:#007aff;color:white;text-align:center;padding:16px;border-radius:16px;font-size:17px;font-weight:600;text-decoration:none">' +
    '在高德地图打开</a>' +
    '</div></div>';

  overlay.classList.add('active');

  var routeMap = new AMap.Map('routeMap', { center: to, zoom: 14 });

  if (from) {
    AMap.plugin('AMap.Driving', function() {
      var driving = new AMap.Driving({
        map: routeMap,
        panel: 'routeInfo',
        policy: 'driving.score.first',
      });
      driving.search(from, to, function(status, result) {
        if (status === 'complete' && result.info === 'OK') {
          var steps = result.routes[0].steps;
          var dist = (result.routes[0].distance / 1000).toFixed(1);
          var time = Math.round(result.routes[0].time / 60);
          document.getElementById('routeInfo').innerHTML = '<div style="font-size:13px;color:#8e8e93;margin-bottom:6px">距离 ' + dist + ' km · 约 ' + time + ' 分钟</div>' +
            '<div style="font-size:15px;font-weight:600;color:#1c1c1e">' + steps[0].instruction + '</div>';
        }
      });
    });
  }
}

function closeRoutePanel() {
  var panel = document.getElementById('routePanel');
  if (panel) { panel.style.display = 'none'; }
  document.getElementById('overlay').classList.remove('active');
}
function refreshData() { updateTime(); beaches.forEach(beach => { const statuses = ['crowded', 'moderate', 'quiet']; beach.status = statuses[Math.floor(Math.random() * statuses.length)]; beach.crowd = beach.status === 'crowded' ? '拥挤' : beach.status === 'moderate' ? '适中' : '稀少'; beach.road = beach.status === 'crowded' ? '拥堵' : beach.status === 'moderate' ? '缓行' : '畅通'; }); renderBeachList(); renderCityRoadList(); const btn = document.querySelector('.bottom-btn-icon.refresh'); btn.style.transform = 'rotate(360deg)'; btn.style.transition = 'transform 0.5s'; setTimeout(() => btn.style.transform = 'rotate(0deg)', 500); }
function updateTime() { const now = new Date(); const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); document.getElementById('updateTime').textContent = '更新于: ' + timeStr; }
function startAutoRefresh() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); autoRefreshInterval = setInterval(refreshData, 30000); }
window.onclick = function(event) { if (!event.target.matches('.bottom-btn') && !event.target.closest('.bottom-btn') && !event.target.closest('.layer-menu')) { document.getElementById('layerMenu').classList.remove('active'); } };
window.onbeforeunload = function() { if (autoRefreshInterval) clearInterval(autoRefreshInterval); };
</script>
</body>
</html>
