<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <title>北海避堵出行</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f2f2f7; color: #1c1c1e;
      height: 100vh; overflow-y: auto; overscroll-behavior: contain;
    }
    #map { width: 100%; height: 50vh; touch-action: pan-x pan-y; }

    .header {
      background: linear-gradient(135deg, #14522d 0%, #1a5f2a 50%, #2e8b57 100%);
      color: white; padding: 14px 18px 44px;
      border-radius: 0 0 22px 22px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 13px; opacity: 0.85; margin-top: 3px; }
    .status-bar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.18); padding: 6px 14px;
      border-radius: 20px; font-size: 12px; font-weight: 600; backdrop-filter: blur(4px);
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #34c759; box-shadow: 0 0 6px #34c759; }
    .dot.yellow { background: #ff9500; box-shadow: 0 0 6px #ff9500; }
    .dot.red { background: #ff3b30; box-shadow: 0 0 6px #ff3b30; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .search-box {
      margin: -34px 14px 12px; background: white; border-radius: 14px;
      padding: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      display: flex; gap: 8px;
    }
    .search-box input {
      flex: 1; border: none; background: #f2f2f7; padding: 12px 14px;
      border-radius: 10px; font-size: 14px; outline: none; color: #1c1c1e;
    }
    .search-btn {
      background: #1a5f2a; color: white; border: none;
      padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;
    }

    .card { background: white; border-radius: 16px; margin: 0 14px 12px; overflow: hidden; }
    .card-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 16px; cursor: pointer; user-select: none;
    }
    .card-header:active { background: #f2f2f7; }
    .card-title { font-size: 14px; font-weight: 700; color: #8e8e93; flex: 1; }
    .card-arrow { font-size: 14px; color: #c7c7cc; transition: transform 0.25s; }
    .card.open .card-arrow { transform: rotate(180deg); }
    .card-body { display: none; padding: 0 16px 16px; }
    .card.open .card-body { display: block; }

    .beach-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
    .beach-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f2f2f7; border-radius: 12px; cursor: pointer; font-size: 14px; }
    .beach-item:active { background: #e5e5ea; }
    .beach-icon { font-size: 22px; flex-shrink: 0; }
    .beach-info { flex: 1; min-width: 0; }
    .beach-name { font-weight: 600; color: #1c1c1e; }
    .beach-sub { font-size: 11px; color: #8e8e93; }
    .beach-bar { width: 56px; height: 14px; background: #e5e5ea; border-radius: 7px; overflow: hidden; flex-shrink: 0; }
    .beach-fill { height: 100%; border-radius: 7px; }
    .beach-fill.crowded { background: #ff3b30; }
    .beach-fill.moderate { background: #ff9500; }
    .beach-fill.quiet { background: #34c759; }
    .beach-pct { font-size: 12px; font-weight: 600; width: 40px; text-align: right; flex-shrink: 0; }

    .beach-detail { display: none; padding: 10px 12px; background: #f2f2f7; border-radius: 10px; margin-top: 6px; font-size: 12px; }
    .beach-detail.show { display: block; }
    .beach-detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #8e8e93; }
    .beach-detail-row span:last-child { color: #1c1c1e; font-weight: 600; }

    .road-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
    .road-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f2f2f7; border-radius: 12px; cursor: pointer; }
    .road-item:active { background: #e5e5ea; }
    .road-name { font-size: 14px; font-weight: 600; min-width: 72px; color: #1c1c1e; }
    .road-bar { flex: 1; height: 14px; background: #e5e5ea; border-radius: 7px; overflow: hidden; }
    .road-fill { height: 100%; border-radius: 7px; transition: width 0.8s; }
    .road-fill.high { background: #ff3b30; }
    .road-fill.medium { background: #ff9500; }
    .road-fill.low { background: #34c759; }
    .road-status { font-size: 12px; font-weight: 600; width: 40px; text-align: right; }
    .road-detail { display: none; padding: 10px 12px; background: #f2f2f7; border-radius: 10px; margin-top: 6px; font-size: 12px; }
    .road-detail.show { display: block; }
    .road-detail-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #8e8e93; }
    .road-detail-row span:last-child { color: #1c1c1e; font-weight: 600; }

    .highway-list { display: flex; flex-direction: column; gap: 8px; }
    .highway-item { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #f2f2f7; border-radius: 12px; }
    .highway-icon { font-size: 20px; flex-shrink: 0; }
    .highway-info { flex: 1; }
    .highway-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
    .highway-dir { font-size: 11px; color: #8e8e93; }
    .highway-bar { flex: 1; height: 14px; background: #e5e5ea; border-radius: 7px; overflow: hidden; }
    .highway-fill { height: 100%; border-radius: 7px; transition: width 0.8s; }
    .highway-fill.high { background: #ff3b30; }
    .highway-fill.medium { background: #ff9500; }
    .highway-fill.low { background: #34c759; }
    .highway-status { font-size: 12px; font-weight: 600; width: 44px; text-align: right; }

    .btn-row { display: flex; gap: 10px; margin: 10px 14px 20px; }
    .action-btn {
      flex: 1; background: white; border: none;
      padding: 14px 8px; border-radius: 14px; font-size: 13px; font-weight: 700;
      color: #1c1c1e; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .action-btn:active { background: #f2f2f7; transform: scale(0.97); }

    /* POI markers */
    .poi-marker {
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25); cursor: pointer;
      width: 44px; height: 44px; font-size: 20px; border: 3px solid;
    }
    .poi-marker.beach { border-color: #ff3b30; }
    .poi-marker.island { border-color: #007aff; }
    .poi-marker.food { border-color: #ff9500; }

    /* POI card */
    .poi-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 500; }
    .poi-overlay.show { display: block; }
    .poi-overlay-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); }
    .poi-card {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255,255,255,0.97); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-radius: 22px 22px 0 0; z-index: 501; max-height: 82vh; overflow: hidden;
      box-shadow: 0 -12px 60px rgba(0,0,0,0.12);
    }
    .poi-card.show { display: block; }
    .poi-card-top { padding: 18px 18px 0; }
    .poi-card-close { width: 30px; height: 30px; background: rgba(0,0,0,0.07); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; color: #3c3c43; margin-bottom: 10px; }
    .poi-card-img { width: 100%; height: 190px; object-fit: cover; border-radius: 16px; margin-top: -30px; position: relative; z-index: 1; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
    .poi-card-body { padding: 12px 18px 32px; }
    .poi-card-title { font-size: 24px; font-weight: 800; color: #1c1c1e; letter-spacing: -0.5px; margin: 10px 0 8px; }
    .poi-card-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
    .poi-tag { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .poi-tag.crowded { background: #ff3b301a; color: #ff3b30; }
    .poi-tag.moderate { background: #ff95001a; color: #ff9500; }
    .poi-tag.quiet { background: #34c7591a; color: #34c759; }
    .poi-tag.type-beach { background: #ff3b301a; color: #ff3b30; }
    .poi-tag.type-island { background: #007aff1a; color: #007aff; }
    .poi-tag.type-food { background: #ff95001a; color: #ff9500; }
    .poi-stat-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .poi-stat { flex: 1; background: #f2f2f7; border-radius: 12px; padding: 12px 6px; text-align: center; }
    .poi-stat-val { font-size: 18px; font-weight: 700; color: #1c1c1e; letter-spacing: -0.3px; }
    .poi-stat-lbl { font-size: 10px; color: #8e8e93; margin-top: 2px; font-weight: 500; }
    .poi-desc { font-size: 13px; color: #636366; line-height: 1.6; margin-bottom: 14px; }
    .poi-nav-btn { display: block; width: calc(100% - 36px); margin: 0 auto; background: #007aff; color: white; padding: 15px; border-radius: 14px; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; letter-spacing: -0.3px; box-shadow: 0 4px 14px rgba(0,122,255,0.3); }
  </style>
</head>
<body>

<div id="map"></div>

<div class="header">
  <h1>🗺️ 北海避堵出行</h1>
  <p>实时路况 · 人流监测 · 智慧出行</p>
  <div class="status-bar">
    <div class="status-chip"><div class="dot green" id="trafficDot"></div><span id="trafficLabel">路况正常</span></div>
    <div class="status-chip">🌡️ <span id="aqiVal">42</span> AQI 优</div>
    <div class="status-chip">🕐 <span id="timeSlot">高峰时段</span></div>
  </div>
</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="搜索目的地：银滩/侨港/涠洲岛..." />
  <button class="search-btn" onclick="doSearch()">规划</button>
</div>

<!-- 海滩人流 -->
<div class="card" id="beachCard">
  <div class="card-header" onclick="toggleCard('beachCard')">
    <span class="card-title">🏖️ 北海海滩人流</span>
    <span class="card-arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="beach-list" id="beachList"></div>
  </div>
</div>

<!-- 高速路况 -->
<div class="card" id="highwayCard">
  <div class="card-header" onclick="toggleCard('highwayCard')">
    <span class="card-title">🛣️ 高速路况 <span id="highwayDir" style="font-weight:400;font-size:12px;color:#c7c7cc">往广州方向</span></span>
    <span class="card-arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="highway-list" id="highwayList"></div>
  </div>
</div>

<!-- 市区路况 -->
<div class="card" id="roadCard">
  <div class="card-header" onclick="toggleCard('roadCard')">
    <span class="card-title">🚗 市区路况</span>
    <span class="card-arrow">▼</span>
  </div>
  <div class="card-body">
    <div class="road-list" id="roadList"></div>
  </div>
</div>

<div class="btn-row">
  <button class="action-btn" onclick="switchMap()">🗃️ 图层</button>
  <button class="action-btn" onclick="refreshData()">🔄 刷新</button>
  <button class="action-btn" onclick="locateMe()">📍 定位</button>
</div>

<!-- POI 详情卡片 -->
<div class="poi-overlay" id="poiOverlay" onclick="closePoiCard(event)">
  <div class="poi-overlay-bg"></div>
  <div class="poi-card" id="poiCard">
    <div class="poi-card-top">
      <div class="poi-card-close" onclick="closePoiCard(event)">✕</div>
      <img class="poi-card-img" id="poiImg" src="" alt="" />
      <div class="poi-card-body">
        <div class="poi-card-title" id="poiTitle"></div>
        <div class="poi-card-tags" id="poiTags"></div>
        <div class="poi-stat-row">
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiCrowd">—</div>
            <div class="poi-stat-lbl">人流量</div>
          </div>
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiCongest">—</div>
            <div class="poi-stat-lbl">路况</div>
          </div>
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiDist">—</div>
            <div class="poi-stat-lbl">距你</div>
          </div>
        </div>
        <div class="poi-stat-row">
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiHours">—</div>
            <div class="poi-stat-lbl">最佳前往</div>
          </div>
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiTemp">—</div>
            <div class="poi-stat-lbl">水温</div>
          </div>
          <div class="poi-stat">
            <div class="poi-stat-val" id="poiScore">—</div>
            <div class="poi-stat-lbl">评分</div>
          </div>
        </div>
        <div class="poi-desc" id="poiDesc"></div>
        <a class="poi-nav-btn" id="poiNavBtn" href="#" target="_blank">🗺️ 导航前往</a>
      </div>
    </div>
  </div>
</div>

<script src="https://webapi.amap.com/maps?v=2.0&key=ca95c0ee3d37ae8d31f2790db3f0e99d&callback=initMap"></script>

function initMap() {
  AMap.securityJsCode = '7bbadcee61ad1d59c9f86f2085377565';
  map = new AMap.Map('map', {
    center: [109.1065, 21.4781],
    zoom: 13,
    touchZoom: true,
    dragEnable: true,
    zoomEnable: true,
    touchZoom: true,
  });
  map.on('complete', function() {
    mapReady = true;
    addPoiMarkers();
    renderAll();
  });
}

// ─── POI标注 ───
function addPoiMarkers() {
  if (!mapReady) return;
  pois.forEach(function(poi, i) {
    var sz = poi.type === 'beach' ? 44 : 40;
    var border = poi.type === 'beach' ? '#ff3b30' : poi.type === 'island' ? '#007aff' : '#ff9500';
    var marker = new AMap.Marker({
      position: poi.pos,
      map: map,
      content: '<div class="poi-marker ' + poi.type + '" style="width:' + sz + 'px;height:' + sz + 'px;font-size:' + (sz * 0.45) + 'px;border-color:' + border + '" onclick="openPoiCard(' + i + ')">' + poi.icon + '</div>',
      offset: new AMap.Pixel(-sz/2, -sz/2),
      zIndex: 12
    });
  });
}

// ─── POI卡片 ───
function openPoiCard(i) {
  var poi = pois[i];
  var lvlMap = { crowded: ['#ff3b30', '拥挤'], moderate: ['#ff9500', '适中'], quiet: ['#34c759', '人少'] };
  var lc = lvlMap[poi.level];
  var typeLabel = poi.type === 'beach' ? '海滩' : poi.type === 'island' ? '海岛' : '美食';

  document.getElementById('poiImg').src = poi.img;
  document.getElementById('poiTitle').textContent = poi.icon + ' ' + poi.name;

  var tagsHtml = '<span class="poi-tag ' + poi.level + '">' + lc[1] + '</span>';
  tagsHtml += '<span class="poi-tag type-' + poi.type + '">' + typeLabel + '</span>';
  if (poi.temp !== '-') tagsHtml += '<span class="poi-tag" style="background:#5856d61a;color:#5856d6">水温 ' + poi.temp + '</span>';
  document.getElementById('poiTags').innerHTML = tagsHtml;

  document.getElementById('poiCrowd').textContent = lc[1];
  document.getElementById('poiCrowd').style.color = lc[0];
  var congText = poi.level === 'crowded' ? '拥堵' : poi.level === 'moderate' ? '一般' : '畅通';
  document.getElementById('poiCongest').textContent = congText;
  document.getElementById('poiCongest').style.color = lc[0];
  document.getElementById('poiDist').textContent = getDistance(poi.pos);
  document.getElementById('poiHours').textContent = poi.hours;
  document.getElementById('poiTemp').textContent = poi.temp;
  document.getElementById('poiScore').textContent = poi.score;
  document.getElementById('poiDesc').textContent = poi.desc;

  var navUrl = 'https://uri.amap.com/navigation?to=' + poi.pos[0] + ',' + poi.pos[1] + ',' + poi.name + '&mode=driving&callnative=1';
  document.getElementById('poiNavBtn').href = navUrl;

  document.getElementById('poiOverlay').classList.add('show');
  document.getElementById('poiCard').classList.add('show');
}

function closePoiCard(e) {
  if (e && e.target !== document.getElementById('poiOverlay') && !document.getElementById('poiOverlay').contains(e.target)) return;
  document.getElementById('poiOverlay').classList.remove('show');
  document.getElementById('poiCard').classList.remove('show');
}

function getDistance(pos) {
  if (!currentPos) return '—';
  var R = 6371;
  var dLat = (pos[1] - currentPos[1]) * Math.PI / 180;
  var dLon = (pos[0] - currentPos[0]) * Math.PI / 180;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(pos[1]*Math.PI/180)*Math.cos(currentPos[1]*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  var d = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return d < 1 ? Math.round(d * 1000) + 'm' : d.toFixed(1) + 'km';
}

function renderBeaches() {
  var html = '';
  beaches.forEach(function(b, i) {
    var lc = levelColor[b.level];
    var lt = levelText[b.level];
    html += '<div class="beach-item" onclick="toggleBeachDetail(' + i + ')">';
    html += '<span class="beach-icon">' + b.icon + '</span>';
    html += '<div class="beach-info"><div class="beach-name">' + b.name + '</div><div class="beach-sub">' + lt + '</div></div>';
    html += '<div class="beach-bar"><div class="beach-fill ' + b.level + '" style="width:' + b.pct + '%"></div></div>';
    html += '<span class="beach-pct" style="color:' + lc + '">' + b.pct + '%</span>';
    html += '</div>';
    html += '<div class="beach-detail" id="beachDetail' + i + '">';
    html += '<div class="beach-detail-row"><span>人流密度</span><span style="color:' + lc + '">' + lt + ' ' + b.pct + '%</span></div>';
    html += '<div class="beach-detail-row"><span>拥堵时段</span><span>' + b.peak + '</span></div>';
    html += '<div class="beach-detail-row"><span>高峰预计</span><span>' + b.forecast + '</span></div>';
    html += '<div class="beach-detail-row"><span>推荐前往</span><span>' + b.recommend + '</span></div>';
    html += '</div>';
  });
  document.getElementById('beachList').innerHTML = html;
}

function renderHighways() {
  var html = '';
  highways.forEach(function(h) {
    var lc = levelColor[h.level];
    html += '<div class="highway-item">';
    html += '<span class="highway-icon">' + h.icon + '</span>';
    html += '<div class="highway-info"><div class="highway-name">' + h.name + '</div><div class="highway-dir">' + h.dir + '</div></div>';
    html += '<div class="highway-bar"><div class="highway-fill ' + h.level + '" style="width:' + h.pct + '%"></div></div>';
    html += '<span class="highway-status" style="color:' + lc + '">' + levelText[h.level] + '</span>';
    html += '</div>';
  });
  document.getElementById('highwayList').innerHTML = html;
}

function renderRoads() {
  var html = '';
  roads.forEach(function(r, i) {
    var lc = levelColor[r.level] || '#34c759';
    var lt = levelText[r.level] || '畅通';
    var w = r.level === 'high' || r.level === 'crowded' ? 80 : r.level === 'medium' ? 50 : 20;
    html += '<div class="road-item" onclick="toggleRoadDetail(' + i + ')">';
    html += '<span class="road-name">' + r.name + '</span>';
    html += '<div class="road-bar"><div class="road-fill ' + r.level + '" style="width:' + w + '%"></div></div>';
    html += '<span class="road-status" style="color:' + lc + '">' + lt + '</span>';
    html += '</div>';
    var speed = r.level === 'high' ? '15-25' : r.level === 'medium' ? '30-40' : '45-55';
    var advice = r.level === 'high' ? '❌ 建议绕行' : r.level === 'medium' ? '⏰ 谨慎行驶' : '✅ 畅通';
    html += '<div class="road-detail" id="roadDetail' + i + '">';
    html += '<div class="road-detail-row"><span>拥堵等级</span><span style="color:' + lc + '">' + lt + '</span></div>';
    html += '<div class="road-detail-row"><span>预估车速</span><span>' + speed + ' km/h</span></div>';
    html += '<div class="road-detail-row"><span>出行建议</span><span>' + advice + '</span></div>';
    html += '</div>';
  });
  document.getElementById('roadList').innerHTML = html;
}

function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  if (localPois[q] || localPois[q.replace(/海滩|公园|大道|路/g, '')]) {
    var key = Object.keys(localPois).find(function(k) { return k.includes(q) || q.includes(k); });
    if (key) {
      map.setCenter(localPois[key]);
      map.setZoom(15);
      return;
    }
  }
  // 高德搜索
  AMap.plugin('AMap.ToolBar', function() {
    map.setCity('北海');
  });
  var c = new AMap.ConvertFrom({
    address: q + ',北海', city: '北海'
  });
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      currentPos = [pos.coords.longitude, pos.coords.latitude];
    });
  }
  alert('正在规划：' + q + '\n本地库未找到，调高德搜索...');
}

// ─── 定位 ───
function locateMe() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      currentPos = [pos.coords.longitude, pos.coords.latitude];
      map.setCenter(currentPos);
      map.setZoom(15);
    }, function() {
      alert('定位失败，请检查权限');
    });
  }
}

// ─── 切换地图样式 ───
function switchMap() {
  mapStyleIdx = (mapStyleIdx + 1) % mapStyles.length;
  map.setStyle(mapStyles[mapStyleIdx]);
}

// ─── 时间段 ───
function updateTimeSlot() {
  var h = new Date().getHours();
  var slot = h >= 7 && h <= 9 ? '早高峰' : h >= 17 && h <= 19 ? '晚高峰' : '平峰时段';
  document.getElementById('timeSlot').textContent = slot;
}
