<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>避堵出行 - 实时路况</title>
  <style>
    :root {
      --primary: #1a5f2a;
      --green: #16a34a;
      --yellow: #eab308;
      --red: #dc2626;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --text2: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    
    #map { width: 100%; height: 55vh; }
    
    .header {
      background: linear-gradient(135deg, #14522d 0%, #1a5f2a 50%, #2e8b57 100%);
      color: white; padding: 16px 20px 50px;
      border-radius: 0 0 24px 24px;
    }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    
    .status-bar {
      display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;
    }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.15); padding: 6px 12px;
      border-radius: 20px; font-size: 12px; backdrop-filter: blur(4px);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--yellow); }
    .dot.red { background: var(--red); }
    
    .search-box {
      margin: -36px 16px 16px; background: white; border-radius: 16px;
      padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: flex; gap: 10px;
    }
    .search-box input {
      flex: 1; border: none; background: #f5f5f5; padding: 12px 16px;
      border-radius: 12px; font-size: 15px; outline: none;
    }
    .search-btn {
      background: var(--primary); color: white; border: none;
      padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }
    
    .info-cards {
      padding: 0 16px; display: flex; flex-direction: column; gap: 12px;
    }
    .card {
      background: white; border-radius: 16px; padding: 16px;
      box-shadow: 0 2rpx 8rpx rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .congestion-list { display: flex; flex-direction: column; gap: 10px; }
    .congestion-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; background: #f8fafc; border-radius: 12px;
    }
    .congestion-bar {
      flex: 1; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
    }
    .congestion-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
    .congestion-fill.high { background: var(--red); }
    .congestion-fill.medium { background: var(--yellow); }
    .congestion-fill.low { background: var(--green); }
    
    .route-card { display: flex; flex-direction: column; gap: 8px; }
    .route-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; background: #f8fafc; border-radius: 10px;
    }
    .route-num {
      width: 28px; height: 28px; background: var(--primary); color: white;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .route-text { font-size: 14px; color: var(--text); flex: 1; }
    .route-distance { font-size: 12px; color: var(--text2); }
    
    .alert-banner {
      display: none;
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white; padding: 12px 16px; margin: 0 16px 12px;
      border-radius: 12px; font-size: 14px; font-weight: 600;
      align-items: center; gap: 8px;
    }
    .alert-banner.show { display: flex; }
    
    .btn-row {
      display: flex; gap: 10px; margin: 12px 16px 0;
    }
    .action-btn {
      flex: 1; background: white; border: 2px solid #e2e8f0;
      padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600;
      color: var(--text); display: flex; align-items: center; justify-content: center; gap: 6px;
      cursor: pointer;
    }
    
    .legend {
      display: flex; gap: 16px; padding: 12px 16px; background: white;
      margin: 12px 16px; border-radius: 12px; font-size: 12px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text2); }
    .legend-color { width: 20px; height: 6px; border-radius: 3px; }
  </style>
</head>
<body>

<div id="map"></div>

<div class="header">
  <h1>🗺️ 避堵出行</h1>
  <p>实时路况 + 拥堵预警 · iPad 通用</p>
  <div class="status-bar">
    <span class="status-chip"><span class="dot green"></span> GPS已定位</span>
    <span class="status-chip" id="updateTime"><span class="dot green"></span> 刷新中...</span>
    <span class="status-chip" id="trafficStatus"><span class="dot green"></span> 道路畅通</span>
  </div>
</div>

<div class="search-box">
  <input type="text" id="destination" placeholder="输入目的地，如：德天瀑布" />
  <button class="search-btn" onclick="searchRoute()">规划</button>
</div>

<div class="alert-banner" id="alertBanner">
  🚨 <span id="alertText">前方拥堵，建议绕行！</span>
</div>

<div class="info-cards">
  <div class="card">
    <div class="card-title">📍 周边路况</div>
    <div class="congestion-list" id="congestionList">
      <div class="congestion-item">
        <span style="font-size:13px;width:80px;color:var(--text2)">银滩大道</span>
        <div class="congestion-bar"><div class="congestion-fill low" style="width:20%"></div></div>
        <span style="font-size:12px;color:var(--green);width:50px;text-align:right">畅通</span>
      </div>
      <div class="congestion-item">
        <span style="font-size:13px;width:80px;color:var(--text2)">北海大道</span>
        <div class="congestion-bar"><div class="congestion-fill medium" style="width:55%"></div></div>
        <span style="font-size:12px;color:var(--yellow);width:50px;text-align:right">一般</span>
      </div>
      <div class="congestion-item">
        <span style="font-size:13px;width:80px;color:var(--text2)">侨港风情街</span>
        <div class="congestion-bar"><div class="congestion-fill high" style="width:80%"></div></div>
        <span style="font-size:12px;color:var(--red);width:50px;text-align:right">拥堵</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🛣️ 推荐路线</div>
    <div class="route-card" id="routeCard">
      <div class="route-item">
        <span class="route-num">1</span>
        <span class="route-text">沿G7211高速直行</span>
        <span class="route-distance">约45km</span>
      </div>
      <div class="route-item">
        <span class="route-num">2</span>
        <span class="route-text">从福成出口下高速</span>
        <span class="route-distance">避开市区</span>
      </div>
      <div class="route-item">
        <span class="route-num">3</span>
        <span class="route-text">沿银滩大道直达银滩</span>
        <span class="route-distance">推荐 🚗</span>
      </div>
    </div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:var(--green)"></div>畅通</div>
  <div class="legend-item"><div class="legend-color" style="background:var(--yellow)"></div>缓行</div>
  <div class="legend-item"><div class="legend-color" style="background:var(--red)"></div>拥堵</div>
</div>

<div class="btn-row">
  <div class="action-btn" onclick="switchMap()">🗃 切换图层</div>
  <div class="action-btn" onclick="refreshData()">🔄 刷新数据</div>
  <div class="action-btn" onclick="showMyLocation()">📍 我的位置</div>
</div>

<script type="text/javascript">
  window._AMapSecurityConfig = {
    securityJsCode: '7bbadcee61ad1d59c9f86f2085377565',
  }
</script>
<script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=ca95c0ee3d37ae8d31f2790db3f0e99d&plugin=AMap.Driving,AMap.Scale,AMap.ToolBar,AMap.MapType"></script>

<script>
let map, marker, trafficLayer;
let currentPos = [109.1065, 21.4781]; // 北海 default

function initMap() {
  map = new AMap.Map('map', {
    zoom: 12,
    center: currentPos,
    viewMode: '3D',
    mapStyle: 'amap://styles/whitesmoke'
  });

  // 添加工具条
  map.addControl(new AMap.ToolBar({ position: 'rb' }));
  map.addControl(new AMap.Scale({ position: 'lb' }));

  // 交通图层
  trafficLayer = new AMap.TileLayer.Traffic({ zIndex: 10 });
  map.addLayer(trafficLayer);

  // 定位
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      currentPos = [pos.coords.longitude, pos.coords.latitude];
      map.setCenter(currentPos);
      addMarker(currentPos, '📍 你的位置');
      updateTrafficStatus();
    }, () => {
      addMarker(currentPos, '📍 当前位置(北海)');
    });
  }

  // 点击地图选位置
  map.on('click', e => {
    currentPos = [e.lnglat.lng, e.lnglat.lat];
    addMarker(currentPos, '📍 选中的位置');
  });
}

function addMarker(pos, text) {
  if (marker) map.remove(marker);
  marker = new AMap.Marker({ position: pos, map });
  marker.setLabel({ content: text, direction: 'top' });
}

function searchRoute() {
  const dest = document.getElementById('destination').value;
  if (!dest) { alert('请输入目的地'); return; }
  
  AMap.plugin('AMap.Driving', () => {
    const driving = new AMap.Driving({
      map: map,
      panel: 'routeCard',
      policy: AMap.DrivingPolicy.LEAST_TIME
    });
    driving.search(currentPos, dest, (status, result) => {
      if (status === 'complete') {
        checkCongestion(result);
      } else {
        alert('无法找到路线，请检查目的地');
      }
    });
  });
}

function checkCongestion(result) {
  const steps = result.routes[0].steps || [];
  let congested = false;
  let alertMsg = '';
  
  steps.forEach(step => {
    if (step.road && (step.road.includes('拥堵') || step.traffic_lights === '拥堵')) {
      congested = true;
      alertMsg = `前方 ${step.road || '某路段'} 拥堵，建议绕行`;
    }
  });

  if (congested) {
    document.getElementById('alertBanner').classList.add('show');
    document.getElementById('alertText').textContent = alertMsg;
  }
}

function switchMap() {
  const styles = ['amap://styles/whitesmoke', 'amap://styles/normal', 'amap://styles/dark', 'amap://styles/night'];
  let idx = 0;
  map.setStyle(styles[idx % styles.length]);
}

function refreshData() {
  document.getElementById('updateTime').innerHTML = '<span class="dot green"></span> 刚刚更新';
  trafficLayer.repaint();
  updateTrafficStatus();
}

function showMyLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const p = [pos.coords.longitude, pos.coords.latitude];
      map.setCenter(p);
      map.setZoom(14);
      addMarker(p, '📍 你在这里');
    });
  }
}

function updateTrafficStatus() {
  const now = new Date();
  document.getElementById('updateTime').innerHTML = 
    `<span class="dot green"></span> ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')} 更新`;
}

// 每30秒自动刷新
setInterval(() => { trafficLayer && trafficLayer.repaint(); }, 30000);

window.onload = initMap;
</script>

</body>
</html>
