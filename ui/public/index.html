<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 书架</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>📚 书架</h1>
      <span class="git-info" id="gitInfo"></span>
    </div>
    <div class="header-right">
      <span class="status-dot" id="statusDot"></span>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar: Book list + Chapter list -->
    <nav class="sidebar" id="sidebar">
      <div class="book-list" id="bookList"></div>
      <div class="chapter-list" id="chapterList"></div>
    </nav>

    <!-- Main content -->
    <main class="content" id="content">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">📖</div>
        <h2>选择一本书开始阅读</h2>
        <p class="welcome-sub">点击左侧书册查看章节目录</p>
      </div>
      <div class="chapter-content" id="chapterContent" style="display:none">
        <div class="content-header" id="contentHeader"></div>
        <article id="article"></article>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
