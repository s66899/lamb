<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f1720;--panel:#1a2430;--panel2:#202b3a;--line:#2b3947;--fg:#e2e8f0;--dim:#94a3b8;--acc:#0ea5e9}
body{font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px}
a{color:#38bdf8;text-decoration:none}a:hover{text-decoration:underline}
header{background:linear-gradient(135deg,#1e3a5f,#0f766e);padding:18px 24px;border-radius:12px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:21px;font-weight:700;letter-spacing:.5px}
header .sub{opacity:.8;font-size:12px;margin-top:5px}
.live{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;padding:5px 12px;border-radius:20px;background:#0b1220;border:1px solid var(--line);color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.live.on .dot{background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:pulse 2s infinite}
.live.busy .dot{background:#f59e0b}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:14px}
.card{background:var(--panel);border-radius:10px;padding:13px 15px;border-left:4px solid var(--acc)}
.card.ok{border-left-color:#22c55e}.card.warn{border-left-color:#f59e0b}
.card.miss{border-left-color:#ef4444}.card.info{border-left-color:#a855f7}
.card .n{font-size:25px;font-weight:700;line-height:1.1}
.card .l{font-size:12px;opacity:.78;margin-top:4px}
.card .s{font-size:11px;opacity:.5;margin-top:2px}
.bar{height:7px;background:#0b1220;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#4ade80);transition:width .4s}
details.fold{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:10px;user-select:none;background:var(--panel2)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:before{content:"\25B6";font-size:11px;opacity:.7;transition:transform .15s}
details.fold[open]>summary:before{transform:rotate(90deg)}
details.fold>summary:hover{background:#26333f}
.cnt{margin-left:auto;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:#0b1220;border:1px solid var(--line);color:var(--dim)}
.cnt.bad{background:#3f1d1d;border-color:#7f1d1d;color:#fca5a5}
.cnt.warn{background:#3f2e12;border-color:#92400e;color:#fcd34d}
.body{padding:12px 16px}
.box{background:#151d27;border:1px solid var(--line);border-radius:8px;padding:12px 15px;margin-bottom:9px}
.box h4{font-size:13px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#0b1220;border:1px solid var(--line);color:#cbd5e1;padding:4px 10px;border-radius:5px;font-size:11px;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.lv-err h4{color:#fca5a5}.lv-warn h4{color:#fcd34d}.lv-info h4{color:#93c5fd}.lv-miss h4{color:#fca5a5}
.tip{font-size:11px;opacity:.5;margin-top:6px}
.ok-all{background:#0f2a1a;border-color:#22c55e}.ok-all h4{color:#86efac}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search]{background:#0b1220;border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:6px;font-size:13px;min-width:210px;flex:1}
.btn{background:#0b1220;border:1px solid var(--line);color:var(--fg);padding:8px 13px;border-radius:6px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
details.catsec{background:#151d27;border:1px solid #26313d;border-radius:8px;margin-bottom:8px;overflow:hidden}
details.catsec>summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;user-select:none}
details.catsec>summary::-webkit-details-marker{display:none}
details.catsec>summary:before{content:"\25B6";font-size:10px;opacity:.6}
details.catsec[open]>summary:before{transform:rotate(90deg)}
details.catsec>summary:hover{background:#1b2531}
.catsec .cnt{margin-left:auto}
.zero{color:#4b5563;font-size:12px;padding:10px 14px;display:none}
/* 新增了工艺/标注/来源表三列,表头会被挤成竖排。
   给表头加不换行,容器横向滚动,
   宽度不足时用滚动条而不是把表头压缩。 */
.catsec>div{overflow-x:auto}
/* 表头吸顶。89 行的表往下滚,不知道哪一列是什么 ——
   `position:sticky` 必须配 `top:0`,而且**祖先链上不能有 overflow**,
   这里 .catsec>div 是横向滚动容器,吸附要挂在它身上才生效。
   z-index 也要给足:行 hover 时的背景不能盖住表头。 */
.catsec>div>table>thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 #0b1220}
.catsec{min-width:1460px}
table{min-width:1460px}
/* 斑马线:89 行连续同色,横向拖动找行会串。
   用 nth-child(even) 而不是给每行加 class —— 改模板时不用记得同步 JS。 */
.catsec tbody tr:nth-child(even) td{background:#161f2b}
.catsec tbody tr:nth-child(even):hover td{background:var(--panel2)}
/* 缺件的行整行压暗一点。缺件是要紧的事,不该和齐套的行长得一样。 */
.catsec tbody tr[data-miss="1"] td{background:#2a1418}
.catsec tbody tr[data-miss="1"]:hover td{background:#3a1a20}
.catsec tbody tr[data-miss="1"] td:nth-child(3){box-shadow:inset 3px 0 0 #ef4444}
table{width:100%;border-collapse:collapse;background:var(--panel);font-size:13px;margin-top:4px}
th{background:#243244;padding:9px 8px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
th.c{text-align:center}
td{padding:8px;border-top:1px solid #24303e;vertical-align:middle}
td.c{text-align:center}
tr:hover td{background:var(--panel2)}
.tag{display:inline-block;padding:3px 10px;border-radius:11px;font-size:11px;font-weight:600;white-space:nowrap}
.proto{display:inline-block;min-width:22px;height:20px;line-height:20px;text-align:center;border-radius:4px;font-size:11px;font-weight:700}
.p-A{background:#0ea5e933;color:#7dd3fc}.p-B{background:#f59e0b33;color:#fcd34d}
.p-C{background:#10b98133;color:#6ee7b7}.p-AB{background:#a855f733;color:#d8b4fe}
.p-x{background:#94a3b833;color:#cbd5e1}
/* 表格里不再直接摆缩略图 —— 90 行小图堆在一起,既把每行撑高、
   又让人以为那就是最终形状。改成一个小按钮,点一下弹大图。
   「无图」用一个安静的占位,不留空白框。 */
/* 缩略图。object-fit:contain 不能换成 cover —— 零件图有宽有窄,
   cover 会把窄的那张裁掉两边,看着像另一个零件。 */
.vp{display:block;width:80px;height:56px;object-fit:contain;
    margin:0 auto;border-radius:6px;cursor:zoom-in;background:#0f172a;
    border:1px solid var(--line)}
.vp:hover{border-color:var(--acc);transform:scale(1.04)}
.vp:active{transform:scale(.98)}
.noph{display:inline-block;width:80px;height:56px;line-height:54px;
      text-align:center;border-radius:6px;font-size:10px;opacity:.3;
      border:1px dashed var(--line);cursor:default}
.chk{display:inline-block;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;user-select:none;text-decoration:none}
/* 已到位的交付物是真链接(<a>),点一下直接打开文件。
   原来是 <span data-p>,点了只复制路径,不跳转。 */
.chk.yes:hover{filter:brightness(1.25)}
.chk.yes:active{transform:scale(.97)}
.yes{background:#22c55e;color:#052e16}
.no{background:#3f1d1d;color:#fca5a5;border:1px solid #7f1d1d}
.na{background:#1e293b;color:#64748b;cursor:default}
/* 零件表 STEP 那一格:一个真能转起来的「3D 预览」按钮 + 原来的文件链接。
   浏览器不认 STEP,只有这个按钮点开才是模型;链接点开是满屏 ISO-10303-21。 */
.hit3d{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}
.btn.b3d{padding:2px 8px;font-size:10.5px;font-weight:700;border-radius:5px;
         background:#2563eb;color:#eaf2ff;border:1px solid #3b82f6;cursor:pointer}
.btn.b3d:hover{background:#1d4ed8;color:#fff}
.btn.b3d:active{transform:scale(.97)}
.v3d-why{font-size:10px;color:#fbbf24;border:1px dashed #92400e;border-radius:4px;
         padding:1px 5px;cursor:help}
/* 备注原来靠 `opacity:.7` 压暗 —— 深色底上再乘 0.7 之后几乎贴住背景,
   本人说「暗暗的不好看到」。改成实色 + 提亮,不用不透明度。 */
.note{max-width:210px;font-size:11px;color:#FFD98A;opacity:1;
       word-break:break-all}
.note a,.toNote{color:#FFD98A}
.banner{display:none;align-items:center;gap:10px;background:#3f2e12;border:1px solid #92400e;color:#fcd34d;padding:11px 15px;border-radius:9px;margin-bottom:12px;font-size:13px}
.banner.show{display:flex}
.banner b{color:#fff}
/* ---- P11 总装图 ---- */
.assyGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
          gap:10px;padding:12px 16px}
.assyCard{background:#151d27;border:1px solid #26313d;border-radius:8px;overflow:hidden;
          display:flex;flex-direction:column}
.assyCard .pic{height:132px;background:#0f172a;display:flex;align-items:center;
               justify-content:center;border-bottom:1px solid #26313d}
.assyCard .pic img{max-width:100%;max-height:100%;object-fit:contain}
.assyCard .pic .nosh{color:#4b5563;font-size:11px;text-align:center;padding:0 10px;line-height:1.6}
.assyCard .nm{padding:8px 10px 3px;font-size:12.5px;font-weight:600;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.assyCard .sz{padding:0 10px 7px;font-size:10.5px;opacity:.45}
.assyCard .acts{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}
.assyCard .acts .btn{padding:5px 9px;font-size:11.5px}
/* 3D 预览弹窗
   ★ 两个「定尺」原则,踩过才知道:

   ① 布局:**定高 + 中间弹性**
      标题 / 工具条 / 底栏 都是 flex:0 0 auto,只有 .stage 吃剩余高度。
      以前 .stage 没写 flex、canvas 又是写死的 `height:min(66vh,640px)`,
      三样加起来超过 .box 的 max-height:96vh —— flex 就去**压缩工具条**,
      压成一条几像素的细缝,按钮上的字全叠在一起,于是
      「适应窗口 / 放大 / 测量」那几个按钮既点不准也看不清。

   ② 尺寸:全部用 **em**,单位挂在 --u 上
      --u 同时看**宽和高**(vw + vh),再 clamp 到 11~18px。
      这样 720p 的笔记本、27 寸 4K、浏览器再放大 150%,
      按钮字号/内边距/画布高度都跟着一起缩,
      **任何比例下都是一行、都能看全**,不需要为每种屏幕写一遍媒体查询。
      (以前是写死 px:屏幕一变,按钮不是挤成两行就是小到看不清。) */
.v3d{position:fixed;inset:0;background:#000a;display:flex;align-items:center;
     justify-content:center;z-index:100;
     --u:clamp(11px, 0.40vw + 0.55vh + 5px, 18px);
     font-size:var(--u);padding:1em}
.v3d *{box-sizing:border-box}
.v3d[hidden]{display:none}
.v3d .box{background:#101b2b;border:1px solid #2b4a6b;border-radius:.75em;
          width:min(96vw,68em);height:min(94vh,54em);max-height:94vh;
          display:flex;flex-direction:column;
          box-shadow:0 2.4em 7em #000d}
/* 画布 + 叠加层必须同一块坐标系,否则测量标注会整体偏移 */
.v3d .stage{position:relative;flex:1 1 auto;min-height:8em;overflow:hidden}
.v3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;
            background:#0b1320;touch-action:none;cursor:grab}
.v3d .ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.v3d h3{margin:0;padding:.62em 1.1em;font-size:1.02em;
        border-bottom:1px solid #26405e;color:#eaf2ff;
        display:flex;align-items:baseline;gap:.3em;flex-wrap:wrap;
        flex:0 0 auto;line-height:1.4}
.v3d h3 .dim{font-size:.82em;font-weight:400;color:#7dd3fc}
/* 工具条:视图切换和测量分开两段,用竖线隔开 —— 一排铺开分不清哪个是
   「换个角度」、哪个是「开始量」

   ★ 类名必须叫 `.tbar`,**不能叫 `.bar`**:
   页面顶上那些统计卡用的就是 `.bar`(进度条),规则是
       .bar{height:7px;background:#0b1220;overflow:hidden;margin-top:8px}
   `height:7px` 那一条 `.v3d .bar` 并没有覆盖(它压根没写 height),
   于是工具条被压成 **7px 高的一根细条**,按钮(24px)整个溢出、
   `overflow:hidden` 再把溢出部分裁掉 —— 屏幕上就只剩几条重叠的字。
   表现是「窗口下面显示有问题」,而 HTML 结构、CSS 语法、JS 全都正常。 */
.v3d .tbar{display:flex;flex-wrap:wrap;align-items:center;gap:.35em;
           padding:.5em .8em;border-top:1px solid #26405e;background:#152238;
           flex:0 0 auto}
.v3d .tbar .sep{width:1px;align-self:stretch;background:#2b4a6b;
                margin:0 .25em}
.v3d .tbar .btn{font-size:.84em;padding:.38em .82em;border-radius:.42em;
                white-space:nowrap;flex:0 0 auto;line-height:1.25}
.v3d .tbar .btn.on{background:#2f6fe0;border-color:#7ab0ff;color:#fff}
.v3d .tbar .btn:disabled{opacity:.4;cursor:not-allowed}
.v3d .foot{padding:.5em 1em;border-top:1px solid #26405e;display:flex;
           align-items:center;gap:.7em;flex:0 0 auto;flex-wrap:wrap;
           color:#cfe0f5}
.v3d .foot .btn{flex:0 0 auto;font-size:.84em;padding:.38em 1em;
                 border-radius:.42em}
.v3d .hint{font-size:.78em;opacity:.7;flex:1 1 12em;min-width:0}
.v3d .rd{font-size:.84em;color:#8fe3ff;font-variant-numeric:tabular-nums;
        flex:0 0 auto;text-align:right}
.v3d .err{color:#ffc2c2;font-size:.84em;padding:1em 1.1em}
.v3d .err .tip{margin-top:.6em;color:#a9bdd6;font-size:.92em}
/* ---- P7 在线编辑 ---- */
/* 可编辑单元格:平时和普通单元格长得一样,只在鼠标移上去时给一点提示。
   做成「一眼就是输入框」的样式反而糟 —— 89 行全变成输入框,反而看不出哪些能改。 */
td.e{position:relative;cursor:text}
td.e:hover{background:#1e3a5f55;outline:1px dashed #3b82f6;outline-offset:-1px}
td.e.dirty{background:#7c4a0a44;box-shadow:inset 2px 0 0 #f59e0b}
td.e.dirty:hover{background:#8a5510aa}
#editBar{display:inline-flex;align-items:center;gap:8px;margin-left:6px}
#editBar .n{font-size:12px;color:#fbbf24}
#editBar button[disabled]{opacity:.4;cursor:not-allowed}
/* P14 加工后核对 / 新购件核对 */
#chkBar{display:inline-flex;align-items:center;gap:8px;margin-left:10px;
        padding-left:10px;border-left:1px solid #1e3a5f}
#chkBar .n{font-size:12px;color:#fbbf24}
td.ck{vertical-align:top;background:#101C30}
.catsec tbody tr[data-miss="1"] td.ck{background:#241520}
td.ck select.cks{width:100%;padding:4px 6px;border-radius:6px;font-size:12px;
  border:1px solid #26313d;background:#111a2b;color:#cbd5e1;cursor:pointer}
/* ★ 提亮。
   原来底色是 #0d2a1a / #111a2b 这种**接近背景色**的暗调,
   深色主题下等于「有字但看不清在哪一格」。
   现在底色明显比卡片亮、字色用高亮档,一眼能扫出哪几格已核、哪几格不合格。
   （配色与 theme.py 的 OK_DIM/WARN_DIM/BAD_DIM 保持一致。） */
td.ck select.cks.st-ok{background:#14432C;color:#8DF5AE;border-color:#22C55E}
td.ck select.cks.st-bad{background:#5A1D26;color:#FFA9A9;border-color:#EF4444}
td.ck select.cks.st-redo{background:#5A3C0C;color:#FFD97A;border-color:#F59E0B}
td.ck select.cks.st-todo{background:#22304A;color:#C6D3E6;border-color:#3C4D6B}
td.ck select.cks.dirty{outline:2px solid #f59e0b;outline-offset:1px}
td.ck .cn{margin-top:4px;font-size:11.5px;color:#E4EAF4;min-height:1.2em;
  border-radius:5px;padding:2px 4px;word-break:break-word;cursor:text;
  max-height:4.8em;overflow:auto}
td.ck .cn.ph{color:#8FA0B8;font-style:italic;opacity:1}
td.ck .cn:hover{background:#1e3a5f55;outline:1px dashed #3b82f6;outline-offset:-1px}
td.ck .cn.dirty{background:#7c4a0a44;box-shadow:inset 2px 0 0 #f59e0b;color:#fde68a}
td.ck select.cks[disabled]{opacity:.9;cursor:default}
/* 到货数量:比状态下拉窄一行,右边跟着「需 N / 差 N」 */
td.ck .cq{display:flex;align-items:center;gap:6px;margin-top:5px}
td.ck input.cn-q{width:62px;padding:3px 6px;border-radius:6px;font-size:12px;
  border:1px solid #3C4D6B;background:#0B1220;color:#E4EAF4;
  font-variant-numeric:tabular-nums}
td.ck input.cn-q:focus{outline:2px solid #0A84FF;outline-offset:0;border-color:#0A84FF}
td.ck input.cn-q.short{border-color:#EF4444;color:#FFA9A9;background:#2A1116}
td.ck .cq-hint{font-size:11px;color:#8FA0B8;white-space:nowrap}
td.ck .cq-hint b{color:#C6D3E6;font-weight:600}
td.ck .cq-hint .less{color:#FFA9A9;font-weight:600}
td.ck .cq-lab{font-size:11px;color:#8FA0B8;white-space:nowrap}
/* 确认弹窗:改哪些内容必须列出来。本人要求「提交前弹窗列清单」,
   不能只问一句「确定吗」—— 89 行里错一行没人看得出来。 */
.mask{position:fixed;inset:0;background:#000a;display:flex;align-items:center;
      justify-content:center;z-index:99;padding:24px}
.mask[hidden]{display:none}
.dlg{background:#111a2b;border:1px solid #1e3a5f;border-radius:12px;
     max-width:820px;width:100%;max-height:84vh;display:flex;flex-direction:column;
     box-shadow:0 20px 60px #000a}
.dlg h3{margin:0;padding:14px 18px;border-bottom:1px solid #1e3a5f;font-size:15px}
.dlg .body{padding:0;overflow:auto;flex:1}
.dlg table{width:100%;border-collapse:collapse;font-size:12.5px}
.dlg th,.dlg td{padding:6px 10px;border-bottom:1px solid #1e293b;text-align:left;
                vertical-align:top}
.dlg th{position:sticky;top:0;background:#0f172a;color:#94a3b8;font-weight:600;
        z-index:1;white-space:nowrap}
.dlg .was{color:#f87171;text-decoration:line-through}
.dlg .now{color:#4ade80;font-weight:600}
.dlg .foot{padding:12px 18px;border-top:1px solid #1e3a5f;display:flex;
           gap:10px;align-items:center;justify-content:flex-end}
.dlg .warn{color:#fbbf24;font-size:12px;margin-right:auto;text-align:left}
.btn.pri{background:#1d4ed8;border-color:#3b82f6;color:#fff}
/* ---- 打印 / 存 PDF ----
   这张看板是要发给加工厂的,「文件 → 打印 → 存为 PDF」是常态。
   默认打印出来是深色底 + 大片留白,墨也费。改成白底黑字、
   隐藏所有交互控件、每页重复表头。 */
@media print{
  :root{--bg:#fff;--panel:#fff;--panel2:#f1f5f9;--line:#cbd5e1;--fg:#0f172a;--dim:#475569}
  body{background:#fff;color:#0f172a;padding:0;font-size:11px}
  .toolbar,#editBar,.live,#mini,.banner{display:none!important}
  header{background:none;border:1px solid #cbd5e1;padding:8px 12px;margin-bottom:8px}
  header h1{font-size:16px}header .sub{opacity:.7}
  .cards{grid-template-columns:repeat(4,1fr);gap:6px}
  .card{padding:6px 8px;border:1px solid #cbd5e1;border-left-width:3px}
  .card .n{font-size:16px}.bar{background:#e2e8f0}
  details.fold{border:1px solid #cbd5e1;background:#fff;break-inside:auto}
  /* 折叠的分类在打印时必须展开 —— 折着的框打印出来是空的 */
  details.catsec,details.fold{break-inside:auto}
  details.fold>summary{background:#f1f5f9;padding:6px 10px;font-size:12px}
  details.catsec{background:#fff;border:1px solid #cbd5e1}
  details.catsec>summary{color:#0f172a}
  .catsec>div{overflow:visible}
  table{min-width:0;font-size:9.5px}
  th{background:#e2e8f0!important;color:#0f172a;position:static;box-shadow:none}
  td,th{padding:3px 5px;border-top:1px solid #e2e8f0}
  .catsec tbody tr:nth-child(even) td{background:#f8fafc}
  .catsec tbody tr[data-miss="1"] td{background:#fee2e2}
  .vp{width:44px;height:32px}
  .noph{width:44px;height:32px;line-height:30px}
  .chk,.proto,.tag{color:#0f172a;background:#e2e8f0!important;border:1px solid #cbd5e1}
  .chk.yes{background:#bbf7d0!important}
  .chk.no{background:#fecaca!important;color:#7f1d1d!important}
  a{color:#1d4ed8;text-decoration:underline}
  tr{break-inside:avoid}
}

</head>
<body>
<header>
  <div>
    <h1>__TITLE__</h1>
    <div class="sub">__DESC__</div>
  </div>
  <div class="live" id="live"><span class="dot"></span><span id="liveTxt">__LIVETXT__</span></div>
</header>
<div class="banner" id="banner"></div>
<div class="cards">__CARDS__</div>
<div class="mini" id="mini"></div>
<div id="assyBox"></div>
<details class="fold" id="fMiss"><summary>缺失清单<span class="cnt" id="cMiss">0</span></summary><div class="body" id="missBox"></div></details>
<details class="fold" id="fIss"><summary>数据检查<span class="cnt" id="cIss">0</span></summary><div class="body" id="issBox"></div></details>
<details class="fold" id="fTb" open><summary>零件明细<span class="cnt" id="cTb">0</span></summary><div class="body">  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索 图号 / 名称 / 材料 / 工艺…">
    <button class="btn on" data-f="all">全部</button>
    <button class="btn" data-f="miss">仅缺文件</button>
    <button class="btn" data-f="ready">已齐套</button>
    <button class="btn" data-f="mk">仅有标注</button>
    <button class="btn" id="exp">展开全部分类</button>
    <button class="btn" id="col">收起全部分类</button>
    <button class="btn" id="refresh">刷新</button>
    <button class="btn" id="cpy">复制缺失清单</button>
    <button class="btn" id="cpi">复制数据问题</button>
    <button class="btn" id="csv">导出 CSV</button>
    <span id="editBar"></span><span id="chkBar"></span>
  </div>
  <div id="cats"></div>
</div></details>
<div id="lb"><span class="x" title="关闭(Esc)">&times;</span><img id="lbi" alt="零件大图"><div class="cap" id="lbc"></div><div class="hint">点任意处或按 Esc 关闭</div></div>
<div class="toast" id="toast">已复制</div>
<footer>🐑 助手工程师 · __GEN__ · 单文件看板,可直接发给加工厂</footer>
<script>
const DATA=__DATA__, ISSUES=__ISSUES__, ORDER=__ORDER__, CATS=__CATS__,
      CONFLICT=__CONFLICT__, LIVE_BUILD=__LIVE__, DL=__DL__, DL_LABEL=__DL_LABEL__,
      PAUSED=__PAUSED__,
      ASSY=__ASSY__,
      CHK=__CHK_META__;
const CHK_KINDS=Object.keys(CHK);
const CHK_NAME=Object.fromEntries(CHK_KINDS.map(k=>[k,CHK[k].label]));
const CHK_ST=Object.fromEntries(CHK_KINDS.map(k=>[k,
  Object.fromEntries(CHK[k].statuses.map(s=>[s[0],s[1]]))]));
// 这一件该填哪一栏。规则(引擎 checklist.kind_of 的网页版镜像)由服务端算好,
// 前端只查表,不自己按分类名字猜 —— 两处各写一份「哪些算自产件」,
// 迟早会改漏一处,然后网页上多出一栏、程序里没有,或者反过来。
function chkKind(r){
  for(const k of CHK_KINDS)
    if((CHK[k].cats||[]).indexOf(r.cat)>=0)return k;
  return '';
}
function chkGet(r,k){
  const c=(r.chk&&r.chk[k])||null;
  // ★ qty 必须一起带出来。
  //   早先这里只挑 st/note,外购件的到货数量在数据里明明是有的
  //   (核对表也真的写进去了),到了界面上却永远是空的 —— 框里只剩
  //   那个占位的「—」,人只会以为没记过。数据在、界面不显示,
  //   不报错,最难查。
  return {st:(c&&c.st)||'todo',note:(c&&c.note)||'',
          qty:(c&&c.qty!=null)?c.qty:null};
}
const chkKey=(r,k)=>(r.src||'')+'|'+(r.xrow||'')+'|'+k;
// P7 只有「用本地服务打开」才有写接口。双击打开的静态看板是死文件,
// POST /api/edit 不存在 —— 与其点了报 404,不如根本不给编辑框。
// 判定放在最前面是因为下面 render 表格时就要用,
// 而 LIVE 那行在文件末尾才定义,那时表格早渲染完了。
const EDIT_ON = (location.protocol==='http:'||location.protocol==='https:');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isMiss=r=>DL.some(k=>r[k]&&!r[k+'_exists']);
function chk(r,k,rowIdx){
  const lab=DL_LABEL[k]||k.toUpperCase();
  // 源表明确标了「不需要」,和「需要但没文件」是两回事,样式必须区分
  if(r[k+'_want']===false)
    return '<span class="chk na" title="源表未标注需要该交付物">— '+esc(lab)+'不需要</span>';
  if(!r[k])return '<span class="chk na">— 不需要</span>';
  const how=r[k+'_how']||'';
  if(r[k+'_exists']){
    const path=r[k+'_href']||r[k+'_rel'];
    const tip=(how&&how!=='精确')
      ? path+'\n文件名带后缀,按「'+how+'」匹配到: '+r[k+'_found'] : path;
    const cls='hit-'+(how||'精确');
    const tag=(how&&how!=='精确')?'<span class="ext">'+esc(how)+'</span>':'';
    // 必须是 <a>。以前是 <span data-p>,点了只复制路径,根本不跳转。
    // 路径还要修两处:反斜杠在 URL 里当分隔符用,以及看板在 6_看板\ 下、
    // 文件在 3_3D图\ 下,得先退一级(../)。不改就是 404。
    const link='<a class="chk yes '+cls+'" href="'+esc(fixPath(path))+'"'
      +' target="_blank" title="'+esc(tip+'\n点击打开')+'">✓ '+esc(lab)+tag+'</a>';
    // ★ STEP 别直接甩一个链接出去。
    //   浏览器不认 STEP,点开就是满屏 `ISO-10303-21;` / `CARTESIAN_POINT`
    //   —— 文件好的,浏览器只是把它当文本。以前这一步就是这样,
    //   本人点「3D 图」看到一堆乱码,以为文件坏了。
    //   构建时已经把 STEP 转成 STL(`_网格缓存/`),这里给一个真能转起来的按钮;
    //   转不了(没装 OCP / 模型没有面)才退回链接,并且说清楚为什么。
    if(k==='step'&&r.step_mesh){
      return '<span class="hit3d">'
        +'<button class="btn b3d" type="button" data-v3d-step="'+esc(rowIdx)+'">'
        +'3D 预览</button>'+link+'</span>';
    }
    if(k==='step'&&r.step_mesh_err){
      return link+'<span class="v3d-why" title="'+esc(r.step_mesh_err)+'">'
        +'转不成网格</span>';
    }
    return link;
  }
  return '<span class="chk no" data-p="'+esc(r[k+'_rel'])+'"'
    +' title="期望文件: '+esc(r[k+'_rel'])+'\n文件还没有,点此复制路径">✗ 缺 '+esc(lab)+'</span>';
}
// 交付物链接的路径修正。
//
// 坑 1:Python 的 relative_to() 给的是反斜杠(3_3D图\塑胶件/x.STEP),
//       浏览器 URL 里反斜杠不算分隔符,必须全换正斜杠。
// 坑 2:看板在 6_看板\ 下,交付物在 3_3D图\ / 4_2D图\ 下,要先退一级。
//
// 坑 3:看板还会被复制到别处(用户直接发出去、或发回源目录),
//       那时交付物目录可能叫 3D图 / 2D图,看板本身就在根下、不用退级。
//       所以基准前缀由构建时注入 __BASE__,不在这里猜。
//       目录名的差异由发布脚本重写 DATA 里的字面路径。
//
// 声明必须写成完整的 JS 语句(带引号)。只写 `var __BASE__;` 再指望
// 构建时把整个声明替换掉,是这轮踩的坑:替换后源码变成 `return ../+…`,
// 引号没了,JS 语法错,表格一行都不渲染 —— 而文件 14MB、90 件数据、
// 图片全有,只看大小和 DATA 完全发现不了。
const __BASE__ = "__BASE_VALUE__";
function fixPath(p){
  if(!p)return '#';
  return __BASE__+String(p).replace(/\\/g,'/').replace(/^\/+/,'');
}
function pbadge(r){
  // 汇总表(如「节水马桶总物料」)不属于任何一台样机,proto 为空。
  // 以前回退取文件名首字得到「节」,看板上就出现一堆「A节」,必须区分开。
  const p=(r.proto||'').toUpperCase();
  return p ? '<span class="proto p-'+p+'">'+esc(r.proto)+'</span>'
           : '<span class="proto p-x" title="来自整机汇总表,不属于某一台样机">总表</span>';
}
function row(r,rowIdx){
  // 图示列直接摆缩略图,点一下弹大图。
  // 用 object-fit:contain —— 零件图有宽有窄,不管用 cover 都会被裁掉半张。
  const img=r.img?'<img class="vp" src="'+esc(r.img)+'" alt="'+esc(r.pn||r.nm)+'"'
      +' loading="lazy" onclick="zoom(this.dataset.src,\''+esc(r.pn||r.nm)+'\')"'
      +' data-src="'+esc(r.img)+'" title="'+esc(r.pn||r.nm)+'\n点击看大图">'
    :'<span class="noph" title="原表图示列为空,无法核对形状">无图</span>';
  const note=r.link?'<a href="'+esc(r.link)+'" target="_blank" title="'+esc(r.link)+'">采购链接</a>'
   :(r.note?'<div class="note">'+esc(r.note)+'</div>':'');
  // 源表手工标注(STEP / 出工程图STEP / 新 / 改 …),排查时非常有用
  const mks=(r.marks&&r.marks.length)
    ?'<div class="marks">'+r.marks.map(m=>'<span class="mk">'+esc(m)+'</span>').join('')+'</div>' : '';
  const srcCell=r.src?'<span class="src" title="'+esc(r.src)+'">'+esc(r.src)+'</span>':'';
  // P7 可编辑单元格。rowIdx = 这一行在 DATA 里的下标,
  // 提交时用它找回 cat / xrow / pn,前端不记这些值,免得和 DATA 对不上。
  const ed=(f,html,cls)=>EDIT_ON
    ? '<td class="e '+cls+'" data-f="'+f+'" data-i="'+rowIdx+'">'+html+'</td>'
    : '<td class="'+cls+'">'+html+'</td>';
  let cells='<td class="c">'+r.no+'</td><td class="c">'+pbadge(r)+'</td>'
   +'<td class="c">'+img+'</td>'
   +ed('pn','<b>'+esc(r.pn)+'</b>','')
   +ed('nm',esc(r.nm),'nm')
   +ed('mat',esc(r.mat),'')
   +ed('qty',esc(r.qty),'c')
   +ed('craft','<span class="craft">'+esc(r.craft)+'</span>','')
   +'<td>'+mks+'</td><td>'+srcCell+'</td>';
  DL.forEach(k=>{cells+='<td class="c">'+chk(r,k,rowIdx)+'</td>';});
  cells+=EDIT_ON?'<td class="e" data-f="note" data-i="'+rowIdx+'">'+note+'</td>'
                :'<td>'+note+'</td>';
  cells+=chkCell(r,rowIdx);
  return '<tr data-miss="'+(isMiss(r)?1:0)+'" data-mk="'+(r.marks&&r.marks.length?1:0)+'">'+cells+'</tr>';
}
/* P14 加工后核对 / 新购件核对。
   状态下拉用**原生 <select>**:自己用 div 拼菜单要多管焦点、
   滚动时定位、Esc 关闭这些事,原生控件全都自带,而且键盘能用。
   备注是 contenteditable,和 P7 的备注格一个路子。 */
function chkCell(r,rowIdx){
  const k=chkKind(r);
  if(!k)return '';
  const c=chkGet(r,k);
  const m=CHK[k];
  const opts=m.statuses.map(s=>'<option value="'+s[0]+'"'
      +(s[0]===c.st?' selected':'')+'>'+esc(s[1])+'</option>').join('');
  const dis=EDIT_ON?'':' disabled';
  // 外购件多一行「到货数量」—— 本人原话:采购件的核对是核对数量和型号。
  // 数量直接和需求量并排显示,少了几个一眼就看出来,不用自己算。
  const need=needQty(r);
  const got=c.qty==null?'':String(c.qty);
  const less=chkShort(r,c.qty);
  const qtyRow=m.hasQty
    ? '<div class="cq"><span class="cq-lab">到货</span>'
      +'<input class="cn-q'+(less?' short':'')+'" type="text" inputmode="decimal"'
      +' value="'+esc(got)+'" placeholder="—" data-i="'+rowIdx+'"'
      +' data-k="q'+k+'"'+dis+'>'
      +'<span class="cq-hint">需 <b>'+esc(need==null?'—':need)+'</b>'
      +(less?' · 差 <span class="less">'+esc(less)+'</span>':'')+'</span></div>'
    : '';
  return '<td class="ck" data-i="'+rowIdx+'" data-k="'+k+'">'
    +'<select class="cks st-'+c.st+'" data-i="'+rowIdx+'" data-k="k'+k+'"'+dis
    +'>'+opts+'</select>'
    +qtyRow
    +(EDIT_ON
        ?'<div class="cn'+(c.note?'':' ph')+'" data-i="'+rowIdx+'" data-k="n'+k+'">'
          +esc(c.note||'点这里写备注')+'</div>'
        :(c.note?'<div class="cn">'+esc(c.note)+'</div>':''))
    +'</td>';
}
/* 需求量:取不到就 null —— 宁可显示「—」,也不编一个数字出来。
   量表里常见的「2+2+2=6」这类写法会被求值成 6。 */
function needQty(r){
  const v=(r.qty==null?r.need:r.qty);
  if(v==null||v==='')return null;
  const s=String(v).trim();
  const eq=s.lastIndexOf('=');
  const body=eq>=0?s.slice(eq+1):s;
  const n=parseFloat(body.replace(/[^+0-9eE.\-]/g,''));
  return isFinite(n)?n:null;
}
function chkShort(r,got){
  const need=needQty(r);
  if(need==null||got==null||got==='')return 0;
  const g=parseFloat(String(got));
  if(!isFinite(g))return 0;
  const d=need-g;
  return d>0?d:0;
}
function chkHead(cat){
  for(const k of CHK_KINDS)
    if((CHK[k].cats||[]).indexOf(cat)>=0)
      return '<th style="width:190px">'+esc(CHK[k].label)+'</th>';
  return '';
}
const HEAD_T='<thead><tr><th style="width:44px" class="c">#</th><th style="width:52px" class="c">机</th>'
  +'<th style="width:92px" class="c">图示</th><th style="width:158px">图号</th><th style="width:214px">名称</th>'
 +'<th style="width:82px">材料</th><th style="width:88px" class="c">数量</th>'
  +'<th style="width:86px">工艺</th><th style="width:104px">标注</th>'
  +'<th style="width:124px">来源表</th>'
 +DL.map(k=>'<th style="width:150px" class="c">'+esc(DL_LABEL[k]||k)+'</th>').join('')
 +'<th>备注 / 链接</th>@CKHEAD@</tr></thead>';
// 表头**按分类**生成:自产件那几张表最后一列叫「加工后核对」,
// 外购件那张叫「新购件核对」。以前 HEAD 是一个常量,所有分类共用,
// 想让同一列在不同分类下换个名字就只能加一列 —— 那会让表格宽一倍,
// 而且大部分格子用不上。
// 这个占位标记故意用单 @ 包起来而不是双下划线:双下划线那种会被
// tpl_test 当成「dashboard.py 该替换、却忘了替换的占位符」而误报,
// 而它其实是在浏览器里替换的,Python 那边根本不碰。
function headOf(cat){return HEAD_T.replace('@CKHEAD@',chkHead(cat));}

document.getElementById('cats').innerHTML=ORDER.map((c,i)=>{
  const g=DATA.filter(r=>r.cat===c);
  if(!g.length)return '';

/* ---- 手动刷新 ----
   SSE 是自动的那道保险,这颗按钮是手动的那道。
   - 实时模式(经本地服务打开):先问服务端「文件夹变了什么」,重建后
     带时间戳重载 —— 不加时间戳浏览器会拿缓存,点了跟没点一样。
   - 静态快照(双击打开的文件):服务端不存在,只能重新读磁盘上那份
     文件。file:// 下 fetch 会被 CORS 挡掉,所以退化成整页重载。 */
document.getElementById('refresh').addEventListener('click',function(){
  var btn=this;
  btn.disabled=true;btn.textContent='检测中…';
  function done(msg,reload){
    btn.disabled=false;btn.textContent='刷新';
    if(msg)toast(msg);
    if(reload)setTimeout(function(){
      location.replace(location.pathname+'?t='+Date.now());},400);
  }
  if(!LIVE){done('静态快照 · 重新打开即读取最新');return;}
  fetch('api/scan',{method:'POST'})
    .then(function(r){return r.json().catch(function(){return{};});})
    .then(function(j){
      var s=j.summary||(j.any?'有变化':'没有变化');
      done((j.rebuilt?'已重建':'未重建')+' · '+s,true);
    })
    .catch(function(){done('检测失败,直接重载',true);});
});
document.getElementById('cpy').addEventListener('click',()=>{

document.getElementById('csv').addEventListener('click',()=>{

  const cv=(c,r)=>typeof c[1]==='function'?c[1](r):r[c[1]];
  const q=s=>{s=''+s;return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const cols=[['分类','cat'],['样机','proto'],['图号','pn'],

  DATA.forEach(r=>out.push(cols.map(c=>q(cv(c,r))).join(',')));
  const blob=new Blob(['\ufeff'+out.join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='零件清单_'+new Date().toISOString().slice(0,10)+'.csv';
