name: Deploy Pages (custom)

on:
  push:
    branches: [book]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Disable concurrent runs, queue deploys serially
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Switch Pages to Actions-only mode
        run: |
          echo "=== 当前 Pages 配置 ==="
          CURRENT=\$(gh api /repos/\${{ github.repository }}/pages -q '.build_type + " " + .source.branch' 2>/dev/null || echo "unknown")
          echo "build_type: \$CURRENT"
          echo "=== 尝试切换到 Actions mode ==="
          RESULT=\$(gh api /repos/\${{ github.repository }}/pages -X PUT -f build_type=workflow --silent 2>&1)
          echo "Switch result: \$RESULT"
          if echo "\$RESULT" | grep -qi "Bad Request\|403\|Not Found"; then
            echo "❌ API 调用被拒绝（Token 无 admin 权限）"
            echo "需要手动去 Settings → Pages → 切 Source 为 GitHub Actions"
          else
            echo "✅ 切换成功！下次 push 不会再触发内置 Pages workflow"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no-op, static site)
        run: echo "Static site — nothing to build"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
