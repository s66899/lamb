name: Deploy Pages (custom)

on:
  push:
    branches: [book]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Disable concurrent runs, queue deploys serially
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Switch Pages to Actions-only mode
        run: |
          echo "Current Pages config:"
          gh api /repos/${{ github.repository }}/pages 2>&1 | head -10
          echo "---"
          echo "Trying to switch to Actions mode..."
          gh api /repos/${{ github.repository }}/pages -X PUT --input - <<< '{"build_type":"workflow"}' 2>&1 || echo "API update failed (expected if token lacks admin). Next push may still trigger built-in workflow."
          echo "Done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no-op, static site)
        run: echo "Static site — nothing to build"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
