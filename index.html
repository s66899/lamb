<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📚 知识书塔 · CodeCombat 式学习游戏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ Splash ═══ -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-icon">🗺️</div>
    <div class="splash-title">📚 知识书塔</div>
    <div class="splash-sub">⚔️ 用知识武装自己 · 闯关升级！</div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><span>📖 六本宝典</span><span>🎯 闯关学习</span><span>🏆 成就系统</span><span>🧪 知识测验</span></div>
    <div class="splash-bar"><div class="splash-bar-fill" id="splashBar"></div></div>
  </div>
</div>

<!-- ═══ App ═══ -->
<div id="app" style="display:none">

  <!-- Header -->
  <header>
    <div class="h-left">
      <button class="h-btn" onclick="toggleSidebar()" title="📂 地图" style="font-size:16px">☰</button>
      <span class="h-logo" onclick="goHome()">🏰</span>
      <div class="h-search" onclick="openSearch()">
        <span>🔍</span>
        <span class="h-search-text">🔎 搜索关卡…</span>
        <kbd>/</kbd>
      </div>
    </div>
    <div class="h-right">
      <!-- RPG HUD -->
      <div id="rpgHud"></div>
      <button class="h-btn" onclick="openStats()" title="📊 冒险报告">📈</button>
      <button class="h-btn" onclick="toggleStudyMode()" title="🔁 复习模式">🔁</button>
      <button class="h-btn" onclick="randomChapter()" title="🎲 随机抽关">🎲</button>
      <button class="h-btn" onclick="toggleTheme()" title="🌓 主题切换">🌓</button>
      <button class="h-btn" onclick="openShortcuts()" title="⌨️ 快捷键">⌨️</button>
      <span class="h-badge" id="progressBadge">⬜ 0%</span>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="side-section">
        <div class="side-title">📚 地图列表</div>
        <div id="bookList"></div>
      </div>
      <div class="side-section" id="chSection" style="display:none">
        <div class="side-title" id="chSectionTitle">🗂️ 关卡</div>
        <div id="chapterList"></div>
      </div>
      <div class="side-section side-section-links">
        <div class="side-link" onclick="openSearch()"><span class="sl-icon">🔍</span> 搜索</div>
        <div class="side-link" onclick="openAchievements()"><span class="sl-icon">🏆</span> 成就<span class="sl-xp"></span></div>
        <div class="side-link" onclick="openQuests()"><span class="sl-icon">📋</span> 任务<span class="sl-xp"></span></div>
        <div class="side-link" onclick="toggleStudyMode()"><span class="sl-icon">🔁</span> 复习</div>
        <div class="side-link" onclick="randomChapter()"><span class="sl-icon">🎲</span> 随缘</div>
        <div class="side-link" onclick="openStats()"><span class="sl-icon">📈</span> 数据</div>
      </div>
    </aside>

    <!-- Content -->
    <main class="content" id="content">

      <!-- Dashboard -->
      <div id="viewDashboard">
        <div class="hero">
          <div class="hero-avatar" id="heroAvatar" onclick="openStats()">🧙</div>
          <h1 class="hero-title">📚 知识书塔</h1>
          <div class="hero-level-badge" id="heroLevel">Lv.1 · ✨ 初心者</div>
          <p class="hero-sub" id="heroSub"></p>
          <div class="hero-xp-area">
            <div class="hero-xp-label" id="heroXpLabel"><span>🧪 经验值</span><span>0%</span></div>
            <div class="hero-xp-bar"><div class="hero-xp-fill" id="heroXpFill" style="width:0%"></div></div>
          </div>
          <div class="hero-bar"><div class="hero-bar-fill" id="heroBar"></div><div class="hero-bar-glow" id="heroBarGlow"></div></div>
          <div class="hero-streak" id="heroStreak"></div>
          <div class="hero-achievements" id="heroAchievements"></div>
        </div>
        <div class="book-grid" id="bookGrid"></div>
      </div>

      <!-- Book -->
      <div id="viewBook" style="display:none">
        <div class="view-header" id="bookHeader"></div>
        <div class="book-stats" id="bookStats"></div>
        <div class="chapter-grid" id="chapterGrid"></div>
      </div>

      <!-- Reader -->
      <div id="viewReader" style="display:none">
        <div class="reader-toolbar">
          <button class="tb-btn" onclick="goToBook(currentBookId)">◀ 📂</button>
          <span class="tb-title" id="readerTitle"></span>
          <span class="tb-pos" id="chapterPos"></span>
          <div class="tb-group">
            <button class="tb-btn" onclick="prevChapter()" title="◀ 上一关">◀</button>
            <button class="tb-btn" onclick="nextChapter()" title="下一关 ▶">▶</button>
            <button class="tb-btn" onclick="toggleReadMark()" id="readMarkBtn" title="✅ 通关">📌</button>
            <button class="tb-btn" onclick="toggleTocFn()" title="🗺️ 导航">🗺️</button>
            <button class="tb-btn" onclick="toggleFocus()" title="🧘 专注">🧘</button>
            <button class="tb-btn" onclick="toggleQuizPanel()" title="🧪 测试">🧪</button>
          </div>
          <div class="tb-group">
            <button class="tb-btn" onclick="decreaseFont()" title="🔽 缩小">🔽</button>
            <button class="tb-btn" onclick="increaseFont()" title="🔼 放大">🔼</button>
          </div>
        </div>

        <div class="reader-layout">
          <div class="reader-toc" id="readerToc">
            <div class="toc-title">🗺️ 导航</div>
            <div id="tocList"></div>
          </div>
          <div class="reader-main" id="readerMain">
            <div class="quiz-sidebar" id="quizSidebar" style="display:none">
              <div class="quiz-title">🧪 关卡测试</div>
              <div id="quizContent"></div>
            </div>
            <div class="reader-content" id="readerContent">
              <article id="article"></article>
              <div class="reader-nav" id="readerNav"></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- FAB -->
  <button class="fab" id="fab" onclick="scrollToTop()" title="⬆ 回到顶部">⬆</button>
</div>

<script src="manifest_data.js"></script>
<script src="app.js"></script>
</body>
</html>
