<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>📚 知识书架 · 交互学习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══ Splash Screen ═══ -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-icon">📚</div>
    <div class="splash-title">知识书架</div>
    <div class="splash-sub">正在加载知识库…</div>
    <div class="splash-bar"><div class="splash-bar-fill" id="splashBar"></div></div>
  </div>
</div>

<!-- ═══ App ═══ -->
<div id="app" style="display:none">

  <!-- Header -->
  <header>
    <div class="h-left">
      <button class="h-btn" onclick="toggleSidebar()" id="sideToggle" title="侧栏">☰</button>
      <span class="h-logo" onclick="goHome()">📚</span>
      <div class="h-search" onclick="openSearch()">
        <span>🔍</span>
        <span class="h-search-text">搜索全部知识…</span>
        <kbd>/</kbd>
      </div>
    </div>
    <div class="h-right">
      <button class="h-btn" onclick="openStats()" title="阅读统计">📊</button>
      <button class="h-btn" onclick="toggleStudyMode()" title="学习模式">🎯</button>
      <button class="h-btn" onclick="randomChapter()" title="随机发现">🎲</button>
      <button class="h-btn" onclick="toggleTheme()" title="切换主题">🌓</button>
      <span class="h-badge" id="progressBadge">0%</span>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="side-section">
        <div class="side-title">📖 书册</div>
        <div id="bookList"></div>
      </div>
      <div class="side-section" id="chSection" style="display:none">
        <div class="side-title" id="chSectionTitle">📂 章节</div>
        <div id="chapterList"></div>
      </div>
      <div class="side-section side-section-links">
        <div class="side-link" onclick="openSearch()">🔍 搜索</div>
        <div class="side-link" onclick="toggleStudyMode()">🎯 学习模式</div>
        <div class="side-link" onclick="randomChapter()">🎲 随机发现</div>
        <div class="side-link" onclick="openStats()">📊 统计</div>
        <div class="side-link" onclick="showShortcuts()">⌨️ 快捷键</div>
      </div>
    </aside>

    <!-- Content -->
    <main class="content" id="content">

      <!-- ═══ View: Dashboard ═══ -->
      <div id="viewDashboard">
        <div class="hero">
          <div class="hero-emoji">📚</div>
          <h1 class="hero-title">知识书架</h1>
          <p class="hero-sub" id="heroSub"></p>
          <div class="hero-bar"><div class="hero-bar-fill" id="heroBar"></div></div>
          <div class="hero-streak" id="heroStreak"></div>
        </div>
        <div class="book-grid" id="bookGrid"></div>
      </div>

      <!-- ═══ View: Book ═══ -->
      <div id="viewBook" style="display:none">
        <div class="view-header" id="bookHeader"></div>
        
        <!-- Mini stats -->
        <div class="book-stats" id="bookStats"></div>

        <!-- Chapter grid -->
        <div class="chapter-grid" id="chapterGrid"></div>
      </div>

      <!-- ═══ View: Reader ═══ -->
      <div id="viewReader" style="display:none">
        <!-- Toolbar -->
        <div class="reader-toolbar">
          <button class="tb-btn" onclick="goToBook(currentBookId)">← 目录</button>
          <span class="tb-title" id="readerTitle"></span>
          <span class="tb-pos" id="chapterPos"></span>
          <div class="tb-group">
            <button class="tb-btn" onclick="prevChapter()" title="上一章 (←)">◀</button>
            <button class="tb-btn" onclick="nextChapter()" title="下一章 (→)">▶</button>
            <button class="tb-btn" onclick="toggleReadMark()" id="readMarkBtn" title="标记已读 (B)">📌</button>
            <button class="tb-btn" onclick="toggleTocFn()" title="目录 (T)">📑</button>
            <button class="tb-btn" onclick="toggleFocus()" title="专注模式 (F)">🧘</button>
            <button class="tb-btn" onclick="toggleQuizPanel()" title="本章测验">❓</button>
          </div>
          <div class="tb-group">
            <button class="tb-btn" onclick="decreaseFont()" title="缩小">A−</button>
            <button class="tb-btn" onclick="increaseFont()" title="放大">A+</button>
          </div>
        </div>

        <div class="reader-layout">
          <!-- TOC -->
          <div class="reader-toc" id="readerToc">
            <div class="toc-title">📑 本节目录</div>
            <div id="tocList"></div>
          </div>

          <!-- Content -->
          <div class="reader-main" id="readerMain">
            <!-- Quiz sidebar -->
            <div class="quiz-sidebar" id="quizSidebar" style="display:none">
              <div class="quiz-title">❓ 本章测验</div>
              <div id="quizContent"></div>
            </div>
            <div class="reader-content" id="readerContent">
              <article id="article"></article>
              <div class="reader-nav" id="readerNav"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- ═══ Overlay: Search ═══ -->
      <div class="overlay" id="searchOverlay" style="display:none" onclick="if(event.target===this)closeSearch()">
        <div class="panel panel-search" onclick="event.stopPropagation()">
          <div class="panel-hd">
            <input type="text" id="searchInput" placeholder="搜索全部书籍内容…" autofocus onkeydown="if(event.key==='Enter')doSearch(this.value)">
            <button class="h-btn" onclick="closeSearch()">✕</button>
          </div>
          <div class="panel-bd" id="searchResults">
            <div class="search-hint">输入关键词后按 Enter 搜索</div>
          </div>
        </div>
      </div>

      <!-- ═══ Overlay: Stats ═══ -->
      <div class="overlay" id="statsOverlay" style="display:none" onclick="if(event.target===this)closeStats()">
        <div class="panel panel-stats" onclick="event.stopPropagation()">
          <div class="panel-hd"><span>📊 阅读统计</span><button class="h-btn" onclick="closeStats()">✕</button></div>
          <div class="panel-bd" id="statsContent"></div>
        </div>
      </div>

      <!-- ═══ Overlay: Study ═══ -->
      <div class="overlay" id="studyOverlay" style="display:none" onclick="if(event.target===this)closeStudyMode()">
        <div class="panel panel-study" onclick="event.stopPropagation()">
          <div class="panel-hd"><span>🎯 学习模式</span><button class="h-btn" onclick="closeStudyMode()">✕</button></div>
          <div class="panel-bd" id="studyBody"></div>
        </div>
      </div>

      <!-- ═══ Overlay: Shortcuts ═══ -->
      <div class="overlay" id="shortcutsOverlay" style="display:none" onclick="if(event.target===this)closeShortcuts()">
        <div class="panel panel-sm" onclick="event.stopPropagation()">
          <div class="panel-hd"><span>⌨️ 快捷键</span><button class="h-btn" onclick="closeShortcuts()">✕</button></div>
          <div class="panel-bd" id="shortcutsContent"></div>
        </div>
      </div>

      <!-- ═══ Overlay: Quiz full ═══ -->
      <div class="overlay" id="quizOverlay" style="display:none" onclick="if(event.target===this)closeQuizOverlay()">
        <div class="panel panel-quiz" onclick="event.stopPropagation()">
          <div class="panel-hd"><span>❓ 知识测验</span><button class="h-btn" onclick="closeQuizOverlay()">✕</button></div>
          <div class="panel-bd" id="quizFullContent"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Floating action button -->
  <button class="fab" id="fab" onclick="scrollToTop()" title="回到顶部">↑</button>
</div>

<script src="manifest_data.js"></script>
<script src="app.js"></script>
</body>
</html>
