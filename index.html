<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 书架</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>📚 书架</h1>
    </div>
    <div class="header-right">
      <span class="repo-badge">github.com/s66899/lamb</span>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <div class="book-list" id="bookList"></div>
      <div class="chapter-list" id="chapterList">
        <div class="placeholder">← 选择一本书</div>
      </div>
    </nav>

    <main class="content" id="content">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">📖</div>
        <h2>选择一本书开始阅读</h2>
        <p class="welcome-sub">左侧书册 → 选择章节 → 在线阅读</p>
      </div>
      <div class="chapter-content" id="chapterContent" style="display:none">
        <div class="content-header" id="contentHeader"></div>
        <article id="article"></article>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
